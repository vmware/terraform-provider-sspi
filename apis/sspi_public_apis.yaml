components:
  parameters:
    BundleTypeFilter:
      name: type
      in: query
      schema:
        $ref: '#/components/schemas/BundleType'
      description: 'Filter bundles by type. When specified, only bundles matching
        this type will be

        processed.

        '
    Offset:
      name: offset
      in: query
      description: 'Offset pagination parameter used to exclude from a response the
        first N items of a resource

        collection. Combine the offset and the page_size options to request a particular
        set or page

        of items.

        '
      schema:
        type: integer
        default: 0
        minimum: 0
    PageSize:
      name: page_size
      in: query
      description: Number of records to be returned in the API request from the provided
        offset
      schema:
        type: integer
        format: int32
        default: 1000
        minimum: 0
    SortAscending:
      name: sort_ascending
      in: query
      description: True, if the list of records returned need to be sorted in ascending
        order, false otherwise.
      schema:
        type: boolean
        default: false
        nullable: true
    SortBy:
      name: sort_by
      in: query
      description: The parameter name on which to sort the list of records. Only top-level
        parameters in the returned list of records will be supported. If not provided,
        system will define the parameter by which results are sorted.
      schema:
        type: string
    SiteIdRequestParam:
      in: path
      name: site-id
      description: Site id in the query
      required: true
      schema:
        type: string
    Id:
      in: path
      name: id
      description: The id of the resource
      required: true
      schema:
        type: string
    SiteIds:
      name: site_ids
      in: query
      description: 'Identifiers of the local managers or sites.

        '
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    DisplayName:
      name: display_name
      schema:
        type: string
      in: query
      description: Use this request parameter to filter by display name.
      example: sensor
    DisplayNames:
      name: display_name
      in: query
      description: 'Use this request param to filter by one or more display names.

        '
      schema:
        type: array
        items:
          type: string
  schemas:
    RemoteUpload:
      title: Remote bundle URL configuration
      description: 'Configuration for importing a bundle from a remote location.

        The URL must be accessible from the installer.

        '
      type: object
      required:
      - url
      properties:
        url:
          title: Installer accessible bundle URL
          type: string
          pattern: ^https?://.+
          description: 'HTTP(S) URL pointing to a valid bundle file.

            The URL must be accessible without authentication.

            '
      example:
        url: https://example.com/resources/bundle.tar
      additionalProperties: false
    LocalUpload:
      title: Local bundle file upload
      description: 'Configuration for uploading a bundle file directly via multipart
        form data.

        '
      type: object
      required:
      - file
      properties:
        file:
          title: Bundle file data
          type: string
          format: binary
          description: Binary content of the bundle file
      additionalProperties: false
    BundleStatus:
      type: string
      enum:
      - IN_PROGRESS
      - READY
      - IN_USE
      - ATTACHED
      - CANCELLED
      - ERROR
      - FAILED
      title: Bundle Processing Status
      description: 'Current state of the bundle:

        * IN_PROGRESS: Upload/download in progress, check progress field for percentage

        * READY: Available for deployment and use

        * IN_USE: Bundle is actively used and cannot be deleted

        * ATTACHED: Bundle is attached to a platform instance

        * CANCELLED: Upload was cancelled by user or system

        * ERROR: Processing failed due to unexpected internal system errors

        * FAILED: Processing failed due to validation errors

        '
      readOnly: true
    ListBundles:
      title: Bundle List Response
      description: 'Paginated list of bundles with metadata for navigation. Use the
        pagination fields

        to iterate through large result sets.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        properties:
          results:
            description: 'Array of bundle objects matching the query criteria. Each
              bundle includes its

              current status and metadata.

              '
            type: array
            items:
              $ref: '#/components/schemas/Bundle'
    Bundle:
      title: Bundle information
      description: Information about a bundle.
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        required:
        - bundle_version
        - size
        - bundle_type
        - packaged_time
        - status
        - progress
        - message
        - addons
        properties:
          bundle_version:
            type: string
            title: Bundle Version
            readOnly: true
            description: Version string identifying the build and release of this
              bundle.
          size:
            type: integer
            title: Bundle Size
            readOnly: true
            description: Total size of the bundle file in bytes.
          bundle_type:
            $ref: '#/components/schemas/BundleType'
          parent_id:
            type: string
            title: Parent Bundle ID
            readOnly: true
            description: 'For patch bundles (PLATFORM_PATCH, etc.), this references
              the ID

              of the base bundle that must be available first. Null for non-patch
              bundles.

              '
          packaged_time:
            $ref: '#/components/schemas/EpochMsTimestamp'
          status:
            $ref: '#/components/schemas/BundleStatus'
          progress:
            type: integer
            readOnly: true
            title: Processing Progress
            description: 'Upload/processing progress as a percentage (0-100). Only
              meaningful when status

              is IN_PROGRESS. Remains at 100 for completed operations.

              '
          message:
            type: string
            readOnly: true
            title: Status Message
            description: 'Human-readable message providing additional context about
              the current status.

              Contains error details when status is ERROR or FAILED, or progress updates

              during processing.

              '
          addons:
            type: array
            items:
              $ref: '#/components/schemas/AddonBundle'
            title: Included Add-on Bundles
            description: 'List of add-on bundles included in this bundle. These add-on
              bundles are

              attached by default when the parent bundle is deployed.

              '
        example:
          bundle_version: 5.0.0.0.0.12345678
          status: READY
          bundle_type: PLATFORM
          packaged_time: 17198592000
          progress: 100
          size: 25000000
          message: uploading is done.
          addons: []
      type: object
      additionalProperties: false
    AddonBundle:
      title: Add-on bundle information
      description: Information about an add-on bundle.
      allOf:
      - type: object
        required:
        - id
        - bundle_version
        - bundle_type
        - description
        - required
        properties:
          id:
            type: string
            title: Add-on Bundle ID
            readOnly: true
            description: 'Unique identifier for this add-on bundle. This ID can be
              used to reference

              the add-on in deployment configurations.

              '
          bundle_version:
            type: string
            title: Add-on Version
            readOnly: true
            description: 'Version string for this add-on component. May differ from
              the parent bundle

              version for independently versioned components.

              '
          bundle_type:
            $ref: '#/components/schemas/BundleType'
          description:
            type: string
            readOnly: true
            title: Add-on Description
            description: Description explaining what this add-on provides.
          required:
            type: boolean
            title: Required for Installation
            readOnly: true
            description: 'If true, this add-on must be included during deployment
              for the parent bundle

              to function correctly. Optional add-ons can be excluded if not needed.

              '
        example:
          id: 0c9c4f22-6f54-4ca3-96bc-34db7f5c6111
          bundle_version: 5.2.0.0.0.23456789
          bundle_type: SVM
          description: Service VM Add-on for the SSP 5.2 release
          required: true
      type: object
      additionalProperties: false
    BundleType:
      description: Type of a bundle, identifying its purpose and content type.
      type: string
      enum:
      - PLATFORM
      - INSTALLER
      - PLATFORM_PATCH
      - AVI_OPERATIONS
      - AVI_OPERATIONS_PATCH
      - BMS
      - SVM
      title: Bundle Category
      x-enumDescriptions:
        PLATFORM: SSP platform bundle
        INSTALLER: SSP installer (SSPI) bundle
        PLATFORM_PATCH: Patch bundle for a PLATFORM bundle
        AVI_OPERATIONS: AVI Operations bundle
        AVI_OPERATIONS_PATCH: Patch bundle for an AVI_OPERATIONS bundle
        BMS: Bare Metal Server add-on bundle
        SVM: Service Virtual Machine add-on bundle
      readOnly: true
    EpochMsTimestamp:
      type: integer
      format: int64
