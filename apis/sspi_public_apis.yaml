          type: integer
          title: Generation of this resource config
          description: 'The _revision property describes the current revision of the
            resource.

            To prevent clients from overwriting each other''s changes, update operations
            must include the current _revision of the resource in request body, which
            clients should obtain by issuing a GET operation.

            1. First, issue a GET request to current state of the resource. 2. Change
            the payload as needed to PUT. Retain the _revision as returned in the
            GET call. 3. Include this _revision value in the PUT request body.

            If the `_revision` field is missing, the request will be rejected with
            HTTP 428 (Precondition Required). If the `_revision` is stale (another
            update occurred), the request will be rejected with HTTP 412 (Precondition
            Failed).

