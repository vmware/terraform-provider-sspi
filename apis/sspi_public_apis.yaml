                        IPAM capacity, registry certificates, and addon health
                    - id: VSphere Infrastructure
                      display_name: VSphere Infrastructure
                      description: Checks the vSphere Infrastructure for upgrade readiness,
                        including datastore health, content library accessibility,
                        and VM template inventory references
                    - id: Security Services Platform Installer
