    PlatformFullConfig:
      title: Platform Full Configuration
      description: Full configuration description for the platform.
      type: object
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        required:
        - desired_state
        - compute
        - network
        - service
        - system
        - provider_id
        properties:
          desired_state:
            type: string
            description: 'Enum for the `desired_state`.


              PRECHECK_ONLY: Saves the configuration and performs only the precheck
              workflow. This operation can only be performed when the LCM workflow
              has not started.

              RESET_PRECHECK: Resets the precheck workflow. This operation can only
              be performed when the precheck workflow is FAILED.

              CONTINUE: Starts the LCM workflow with the current configuration. This
              operation can only be used when the precheck workflow is COMPLETED.

              START: Saves the configuration and performs the precheck and LCM (Lifecycle
              Management) workflow. If a previous FAILED or STOPPED LCM workflow exists,
              use the RETRY operation to continue the workflow or the CLEAN operation
              to clean it up.

              STOP: Stops the LCM workflow.

              RETRY: Retries the current workflow with the current configuration.
              This operation can only be used when the LCM workflow is in a FAILED
              or STOPPED state.

              CLEAN: Cleans up the LCM (Lifecycle Management) workflow. This operation
              is only supported for the deployment workflow; the configuration update
              workflow is not supported.

              '
            enum:
            - PRECHECK_ONLY
            - RESET_PRECHECK
            - CONTINUE
            - START
            - STOP
            - RETRY
            - CLEAN
            writeOnly: true
          compute:
            $ref: '#/components/schemas/PlatformProviderConfig'
          network:
            $ref: '#/components/schemas/PlatformNetwork'
          service:
            $ref: '#/components/schemas/PlatformServiceConfig'
          system:
            $ref: '#/components/schemas/PlatformSystemConfig'
          provider_id:
            title: Provider UUID
            description: 'The UUID for the provider in the platform. This is the UUID
              returned from the POST /sspi/providers API.

              '
            type: string
          instance_id:
            title: Instance ID
            description: 'The Platform instance ID.

              '
            type: string
            readOnly: true
    LicenseHubConfig:
