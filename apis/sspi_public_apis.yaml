          enum:
          - PLATFORM_DEPLOYMENT
          - PLATFORM_DELETE
          - PLATFORM_DEPLOYMENT_PRECHECK
          - CONFIG_UPDATE
          - CONFIG_UPDATE_PRECHECK
          - PROVIDER_UPDATE
        start_time:
