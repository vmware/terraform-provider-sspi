      tags:
      - provider-management
      summary: Update a registered vSphere provider configuration
      description: 'Modifies the connection details, credentials, or compute resources
        of an existing vSphere provider asynchronously.


        **Workflow Chain:**

        The response returns a `202 Accepted` along with a `status_url`. Call `GET
        /sspi/providers/{provider-id}/status` to poll the provider update progress
        and verify connection health.

        '
      operationId: UpdateVsphereProvider
      parameters:
      - in: path
        name: provider-id
        description: A globally unique UUID representing the vSphere provider to update.
        required: true
        example: 434348d8-681e-4809-8dc1-427127d2bee7
        schema:
          type: string
      requestBody:
        required: true
        description: The modified vSphere provider definition to apply.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VsphereProviderDefinition'
      responses:
        '202':
          description: 'The provider update request has been accepted.

            Use the returned provider ID and status URL to query for more detailed
            information.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'An error occurred while checking the Platform Installer service.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
    delete:
      tags:
      - provider-management
      summary: Unregister a vSphere provider
      description: 'Deletes the specified vSphere provider registration from the installer''s
        database.


        **Side Effects:**

        * This does NOT delete any resources inside vCenter itself.

        * **Warning:** If platforms are currently deployed and actively tied to this
        provider, deleting the provider record will orphan them and prevent future
        LCM operations on those clusters.

        '
      operationId: DeleteVsphereProvider
      parameters:
      - in: path
        name: provider-id
        description: A globally unique UUID representing the vSphere provider to delete.
        example: 434348d8-681e-4809-8dc1-427127d2bee7
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'An error occurred while checking the Platform Installer service.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
  /sspi/providers/{provider-id}/status:
    get:
      tags:
      - provider-management
      summary: Poll vSphere provider connection health and workflow status
      description: 'Retrieves the comprehensive health and execution status of the
        vSphere provider connection.


        **Returns:**

        * **Connection status:** A boolean indicating whether the installer can currently
        authenticate and connect to the underlying vCenter server.

        * **Workflow results:** Detailed execution state of any active asynchronous
        update tasks triggered by `PUT /sspi/providers/{provider-id}`.

        '
      operationId: GetProviderStatus
      parameters:
      - in: path
        name: provider-id
        description: A globally unique UUID representing the vSphere provider.
        example: 434348d8-681e-4809-8dc1-427127d2bee7
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Comprehensive status of the provider including connection status
            and workflow results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'An error occurred while checking the Platform Installer service.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
  /sspi/iam/login:
    post:
      tags:
      - user-management
      summary: Log in and start an authenticated session
      description: "Authenticates a user against Installer and starts a session. This\
        \ is the entry point for\nall other Installer APIs - every subsequent request\
        \ must present the credentials returned here.\n\n**How to use the response:**\n\
        * On success, the `Set-Cookie` response header contains the session cookie\
        \ and the `X-XSRF-TOKEN`\n  response header contains the XSRF token. Send\
        \ the cookie value in the `Cookie` request header and\n  the token value in\
        \ the `X-XSRF-TOKEN` request header on every subsequent request.\n* The `roles`\
        \ returned in the response body determine which of the other Installer APIs\
        \ this\n  user is authorized to call (see the `security` requirements on each\
        \ operation).\n\n**Notes:**\n* If the user's password has expired, the API\
        \ returns `302` and redirects to the change-password\n  flow instead of returning\
        \ `200`. Call `POST /iam/change-password` before retrying login.\n"
      operationId: Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              user_name: admin
              password: '********'
              user_type: LOCAL_USER
        required: true
      responses:
        '200':
          description: Login succeeded. The session cookie and XSRF token are returned
            in the response headers.
          headers:
            Set-Cookie:
              description: Session cookie. Send it back in the `Cookie` header of
                subsequent requests.
              schema:
                type: string
            X-XSRF-Token:
              description: XSRF token. Send it back in the `X-XSRF-TOKEN` header of
                subsequent requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAuthResponse'
              example:
                user_name: admin
                display_name: Administrator
                user_type: LOCAL_USER
                roles:
                - role: ENTERPRISE_ADMIN
                  display_name: Enterprise Admin
        '302':
          description: The user's password has expired. Redirects to the change-password
            flow instead of completing login.
          headers:
            Location:
              description: URL of the change-password page to redirect the user to.
              schema:
                type: string
                format: uri
        '400':
          description: The request body is malformed or missing a required field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The user name, password, or user type is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sspi/iam/logout:
    post:
      tags:
      - user-management
      summary: End the current session
      description: 'Invalidates the caller''s current session. The session cookie
        obtained from

        `POST /iam/login` is no longer valid after this call succeeds, and a new login

        is required to make further authenticated requests.

        '
      operationId: Logout
      responses:
        '302':
          description: Logout succeeded. Redirects to the login page.
          headers:
            Location:
              description: URL of the login page to redirect the user to.
              schema:
                type: string
                format: uri
        '401':
          description: The session is already invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
      - support_bundle_collector: []
  /sspi/iam/change-password:
    post:
      tags:
      - user-management
      summary: Change your own password
      description: "Changes the password of the currently authenticated local user.\
        \ This is a self-service\noperation - a user can only change their own password,\
        \ and must provide their current\n(old) password to prove ownership.\n\n**Notes:**\n\
        * Only local users have a password to change. Remote (LDAP) users manage their\
        \ password\n  through their identity provider.\n* To reset another local user's\
        \ password without knowing their current password, an\n  `enterprise_admin`\
        \ must use `POST /iam/reset-password` instead.\n"
      operationId: ChangePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              old_password: '********'
              new_password: '********'
        required: true
      responses:
        '204':
          description: The password was changed successfully.
        '400':
          description: The old password is incorrect, or the new password does not
            meet the password policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
      - support_bundle_collector: []
  /sspi/iam/reset-password:
    post:
      tags:
      - user-management
      summary: Reset another local user's password (administrator only)
      description: "Sets a new password for a local user without requiring their current\
        \ password. Use this\nwhen a local user has forgotten their password; use\
        \ `POST /iam/change-password` for the\nself-service case where the old password\
        \ is known.\n\n**Notes:**\n* Requires the `enterprise_admin` role.\n* Remote\
        \ (LDAP) users do not have a local password and cannot be targeted by this\
        \ API -\n  their password is managed by the identity provider.\n"
      operationId: ResetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              user_name: audit
              new_password: '********'
        required: true
      responses:
        '204':
          description: The password was reset successfully.
        '400':
          description: The user does not exist, is not a local user, or the new password
            does not meet the password policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
  /sspi/iam/current-user-info:
    get:
      tags:
      - user-management
      summary: Get the identity and roles of the caller
      description: 'Returns the user name, display name, type, and assigned roles
        of the currently

        authenticated caller.

        '
      operationId: GetCurrentUserInfo
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
              example:
                name: sspuser1@corp.example.com
                display_name: ''
                user_type: REMOTE_USER
                password_status: INVALID
                roles:
                - role: AUDITOR
                  display_name: Auditor
                - role: SUPPORT_BUNDLE_COLLECTOR
                  display_name: Support Bundle Collector
          description: The current user's information was retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
      - support_bundle_collector: []
  /sspi/iam/users:
    get:
      tags:
      - user-management
      summary: List local and remote users and groups
      description: 'Returns the users and groups known to Installer, whether defined
        locally or

        discovered through a configured LDAP identity source. Use the `role` and `user_type`

        filters to narrow results, for example to find every user who holds the `auditor`
        role.

        '
      operationId: GetAllUsersInfo
      parameters:
      - name: name
        in: query
        description: Return only entries whose name contains this value (case-insensitive,
          partial match).
        schema:
          type: string
      - name: role
        in: query
        description: Return only entries that hold at least one of these roles.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SspInstallerRole'
      - name: user_type
        in: query
        description: Return only entries of these user types, e.g. restrict results
          to `LOCAL_USER`.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UserType'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/SortAscending'
      - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoList'
              example:
                offset: 0
                number_of_results: 1
                total_result_count: 1
                total_pages: 1
                sort_ascending: true
                sort_by: name
                results:
                - name: admin
                  display_name: Administrator
                  user_type: LOCAL_USER
                  password_status: ACTIVE
                  roles:
                  - role: ENTERPRISE_ADMIN
                    display_name: Enterprise Admin
          description: The list of matching users and groups was retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
  /sspi/iam/roles:
    get:
      tags:
      - user-management
      summary: List the roles available in Installer
      description: 'Returns the fixed set of roles that can be assigned to a user
        or group, along with

        their display names.

        '
      operationId: GetAllRolesInfo
      parameters:
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/SortAscending'
      - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: The list of available roles was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
              example:
                offset: -1
                number_of_results: 3
                total_result_count: 3
                total_pages: 1
                sort_ascending: true
                sort_by: role
                results:
                - role: AUDITOR
                  display_name: Auditor
                - role: ENTERPRISE_ADMIN
                  display_name: Enterprise Admin
                - role: SUPPORT_BUNDLE_COLLECTOR
                  display_name: Support Bundle Collector
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
  /sspi/iam/role-bindings:
    get:
      tags:
      - user-management
      summary: List which users and groups hold which roles
      description: 'Returns every user or group that currently has at least one role
        assigned, together

        with the roles they hold. The `id` in each result is the value to use as `binding-id`

        when calling `GET`, `PUT`, or `DELETE /iam/role-bindings/{binding-id}`.

        '
      operationId: GetAllRoleBindings
      parameters:
      - name: user_name
        in: query
        description: Return only bindings for the user or group whose name contains
          this value.
        schema:
          type: string
      - name: role
        in: query
        description: Return only bindings that include at least one of these roles.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SspInstallerRole'
      - name: user_type
        in: query
        description: Return only bindings for entities of these user types.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UserType'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/SortAscending'
      - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: The list of role bindings was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBindingList'
              example:
                offset: 0
                number_of_results: 1
                total_result_count: 1
                total_pages: 1
                sort_ascending: true
                sort_by: entity_name
                results:
                - id: 5c4d9f2a-1234-4a11-9d3a-7e6f0b8c2d10
                  entity_name: admin
                  user_type: LOCAL_USER
                  roles:
                  - role: AUDITOR
        '204':
          description: No role bindings exist because no LDAP identity source is configured
            yet.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
    post:
      tags:
      - user-management
      summary: Grant one or more roles to a user or group
      description: 'Creates a new role binding, granting the specified roles to a
        remote (LDAP) user or

        remote (LDAP) group. Local users cannot be granted roles through this API.
        To grant

        additional roles to an entity that already has a binding, use

        `PUT /iam/role-bindings/{binding-id}` instead - this operation always creates
        a new binding.

        '
      operationId: BindRolesToEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleBinding'
            example:
              entity_name: SSPUser2@corp.example.com
              user_type: REMOTE_USER
              roles:
              - role: AUDITOR
      responses:
        '200':
          description: The role binding was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
  /sspi/iam/role-bindings/{binding-id}:
    get:
      tags:
      - user-management
      summary: Get the roles assigned to a specific user or group
      description: 'Returns the role binding identified by `binding-id`. Obtain the
        `binding-id` from the

        `id` field of an entry returned by `GET /iam/role-bindings`.

        '
      operationId: GetRoleBinding
      parameters:
      - in: path
        name: binding-id
        description: The `id` of the role binding, as returned by `GET /iam/role-bindings`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The role binding was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBinding'
              example:
                id: 5c4d9f2a-1234-4a11-9d3a-7e6f0b8c2d10
                entity_name: audit
                user_type: LOCAL_USER
                roles:
                - role: AUDITOR
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
    put:
      tags:
      - user-management
      summary: Replace the roles assigned to a user or group
      description: 'Overwrites the set of roles held by the entity identified by `binding-id`
        with the

        `roles` provided in the request body. This is a full replacement, not a merge
        - any

        role currently held but omitted from the request is removed.

        '
      operationId: UpdateRolesToEntity
      parameters:
      - in: path
        name: binding-id
        description: The `id` of the role binding to update, as returned by `GET /iam/role-bindings`.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleBinding'
            example:
              entity_name: sspuser1@corp.example.com
              user_type: REMOTE_USER
              roles:
              - role: SUPPORT_BUNDLE_COLLECTOR
              - role: AUDITOR
              _revision: 3
      responses:
        '200':
          description: The role binding was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBinding'
        '409':
          description: 'The role binding was modified by another request since it
            was last read. Re-fetch

            the binding via `GET /iam/role-bindings/{binding-id}` and retry with its
            current state.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
