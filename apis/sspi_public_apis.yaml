      properties:
        platform_id:
          type: string
          title: ID of the Platform instance.
          description: The ID of the Platform instance.
        platform_name:
          type: string
          title: Name of the Platform instance.
          description: The name of the Platform instance.
        phase:
          type: string
          title: Workflow Phase
          description: 'The current phase of the workflow.

            - DRAFT: The starting phase.

            - PRECHECK: The phase where the deployment precheck takes place.

            - DEPLOYMENT: The phase where the deployment takes place.

            - DELETE: The phase for cleanup platform tasks after completion.

            - UPDATE_PRECHECK: The phase where the update platform precheck takes
            place after deployment.

            - UPDATE: The phase where the update platform takes place after deployment.

            '
          enum:
          - DRAFT
          - PRECHECK
          - DEPLOYMENT
          - DELETE
          - UPDATE_PRECHECK
          - UPDATE
        workflow_results:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowResult'
          title: Workflow Results
          description: A list of workflow results.
