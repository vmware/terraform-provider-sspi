  /sspi/iam/ldap-identity-sources/search:
    get:
      tags:
      - user-management
      summary: Search for LDAP users and groups to grant roles to
      description: 'Searches one or all configured LDAP identity sources for users
        and groups matching

        `search_param`, typically as a precursor to `POST /iam/role-bindings` - use
        the

        `distinguished_name` or `principal_name` from a result as the `entity_name`
        when

        granting a role. The match is case-insensitive in most LDAP server configurations.

        '
      operationId: SearchLdapIdentitySource
      parameters:
      - in: query
        name: identity_source_id
        description: Restrict the search to this LDAP identity source. If omitted,
          all configured sources are searched.
        required: false
        schema:
          type: string
      - in: query
        name: search_param
        description: 'Text to search for, matched as a prefix (an implicit wildcard
          `*` is appended). Must

          be at least 3 characters; shorter values are rejected to avoid overly broad
          LDAP queries.

          '
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/SortAscending'
      - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: The search completed successfully; `results` may be empty if
            nothing matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LdapIdentitySearchResults'
              example:
                offset: 0
                number_of_results: 1
                total_result_count: 1
                total_pages: 1
                sort_ascending: true
                sort_by: common_name
                results:
                - common_name: sspuser1
                  distinguished_name: cn=sspuser1,ou=Users,dc=corp,dc=example,dc=com
                  principal_name: sspuser1@corp.example.com
                  user_type: REMOTE_USER
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
  /sspi/upgrade/version-summary:
