openapi: 3.0.1
info:
  title: Security Services Platform Installer
  description: 'Security Service Installer (SSPI) deploys Security Service Platform

    SSP is k8s based cluster deployed based on vsphere infrastructure.


    These APIs are meant to support operations related to SSPI

    '
  version: 5.2.0.0.0
  contact:
    name: Broadcom Support
servers:
- url: https://{api_host}
  variables:
    api_host:
      default: sspi.broadcom.com
      description: The value is assigned during installation of SSPI
tags:
- name: package-management
  description: API for managing Security Services Platform Installer packages
- name: instance-management
  description: APIs for lifecycle management of Platform Installer and Platform.
- name: diagnostic
  description: APIs for diagnostic operations of Platform Installer and Platform.
- name: backup-restore
  description: APIs for Platform Installer Backup/Restore operations.
- name: provider-management
  description: APIs for lifecycle management of vSphere providers.
- name: user-management
  description: Installer Authentication API
- name: sspi-upgrade
  description: APIs for managing appliance upgrade operations
paths:
  /sspi/bundles/{id}:
    get:
      tags:
      - package-management
      summary: Retrieve bundle details and upload status
      description: 'Fetches the information about a specific bundle including its
        upload status,

        version details, and metadata.


        **Notes:**

        * Returns `404` if the bundle does not exist or has been deleted

        '
      operationId: GetBundle
      security:
      - enterprise_admin: []
      - auditor: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Unique bundle identifier
          title: Bundle ID
        description: 'UUID string identifying the bundle. Obtain this from `/sspi/bundles/remote`
          or

          `/sspi/bundles/local` upload responses or `/sspi/bundles` list result.

          '
      responses:
        '200':
          description: Bundle information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - package-management
      summary: Remove bundle or cancel upload
      description: 'Permanently deletes a bundle or cancels an in-progress upload
        operation.


        **Notes:**

        * If bundle status is IN_PROGRESS, this will cancel the upload and clean up
        partial data

        * If bundle status is READY, this will permanently remove the bundle from
        storage

        * Once deleted, the bundle cannot be recovered and will need to be uploaded
        again

        * Bundles with status IN_USE or ATTACHED cannot be deleted

        '
      operationId: DeleteBundle
      security:
      - enterprise_admin: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Unique bundle identifier to delete or cancel
          title: Bundle ID
        description: 'UUID string identifying the bundle to remove. This is the same
          ID returned from

          upload operations.

          '
      responses:
        '200':
          description: Bundle successfully deleted or upload cancelled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sspi/bundles:
    get:
      tags:
      - package-management
      summary: List all available bundles
      description: "Retrieves a paginated list of all bundles available in installer\
        \ with their current status\nand metadata.\n\n**Usage:**\n* Use this to discover\
        \ available bundles before selecting one for deployment\n* Results are paginated\
        \ - use the pagination parameters to navigate\n  large result sets\n"
      operationId: GetBundles
      security:
      - enterprise_admin: []
      - auditor: []
      parameters:
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/SortAscending'
      - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: List of available bundles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBundles'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sspi/bundles/remote:
    post:
      tags:
      - package-management
      summary: Import bundle from remote URL
      description: "Initiates an asynchronous download and import of a bundle from\
        \ a remote URL onto installer.\n\n**Notes:**\n* The remote URL must be accessible\
        \ from the installer.\n* Bundle validation occurs during download - invalid\
        \ bundles will result in FAILED status\n  (broken download, incomplete bundle,\
        \ bad metadata)\n* ERROR status is reserved for unexpected internal errors\n"
      operationId: UploadRemoteBundle
      security:
      - enterprise_admin: []
      parameters:
      - $ref: '#/components/parameters/BundleTypeFilter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteUpload'
      responses:
        '202':
          description: 'Bundle import initiated successfully. The response contains
            a request ID and

            a status URL pointing to the bundle resource. Use the returned `status_url`

            to track download status and progress.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sspi/bundles/local:
    post:
      tags:
      - package-management
      summary: Upload bundle file directly
      description: 'Uploads a bundle file directly to installer via multipart form
        data.

        The returned response contains a link to the bundle status endpoint.


        **Notes:**

        * File validation and extraction occurs during upload

        * Invalid bundles will result in FAILED status with diagnostic message

        '
      operationId: UploadLocalBundle
      x-large-file-upload: true
      security:
      - enterprise_admin: []
      parameters:
      - $ref: '#/components/parameters/BundleTypeFilter'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocalUpload'
      responses:
        '202':
          description: 'Bundle file uploaded and processing initiated. The response
            contains a request ID

            and status URL for monitoring validation progress.

            Use the returned status URL to track processing status.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sspi/depot/health:
    get:
      tags:
      - package-management
      summary: Verify package management service health
      description: 'Performs a lightweight health check on the package management
        service to verify

        that it is operational.

        '
      operationId: GetDepotHealth
      security:
      - enterprise_admin: []
      - auditor: []
      responses:
        '204':
          description: Package management service is operational and ready to handle
            requests
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sspi/settings:
    get:
      tags:
      - instance-management
      summary: Retrieves the global settings for Platform Installer
      description: "Fetches the global configuration settings based on the platform\
        \ instance type and its supported form factors.\nEither form_factor or ssp_type\
        \ must be provided, ssp_type parameter represents the platform instance type.\n\
        \nFor MEDIUM form factor:\n  - min_worker_count: 2\n  - max_worker_count:\
        \ 2\n  - Note: Medium supports exactly 2 workers. Use Large form factor for\
        \ 4+ workers\n\nFor LARGE form factor:\n  - min_worker_count: 4\n  - max_worker_count:\
        \ 13\n\nFor EXTRA_LARGE form factor:\n  - min_worker_count: 8\n  - max_worker_count:\
        \ 17\n  - Note: For high-scale deployments with all features\n\nFor instance\
        \ type parameter:\n  - AVI_OPERATIONS: AVI Operations deployment (form_factor\
        \ is SMALL, worker_count: 2)\n  - ATP: Advanced Threat Protection (requires\
        \ form_factor parameter)\n\nIP Pool Count Calculation:\nThe API returns minimum\
        \ IP pool counts (min_node_ip_pool_count and\nmin_service_ip_pool_count) based\
        \ on the form factor and worker count.\n\nFor variable worker count form factors\
        \ (Medium, Large, Extra-Large):\n  - worker_count parameter can override the\
        \ default (must be within valid range)\n  - If not provided, min_worker_nodes\
        \ from the form factor spec is used\n\nFor fixed worker count instance types\
        \ (LICENSING, AVI_OPERATIONS):\n  - worker_count parameter is ignored\n  -\
        \ Always uses min_worker_nodes from the deployment spec\n\nNode IP Pool (all\
        \ deployments): 2 + controller_count + worker_count\n  (1 for VIP + 1 for\
        \ rolling upgrade + all node IPs)\n\nService IP Pool (varies by deployment\
        \ type):\n  - LICENSING/AVI_OPERATIONS: 3 IPs\n    (1 Contour + 1 kafka-external\
        \ + 1 kafka broker, no scaleout)\n  - Medium: 5 IPs (1 Contour + 1 kafka-external\
        \ + 3 kafka brokers hardcoded)\n  - Large/Extra-Large: 3 + ceil(worker_count/2)\n\
        \    (1 Contour + 1 kafka-external + 1 kafka broker + extra brokers for Kafka\
        \ cluster)\n"
      operationId: GetDeploymentSettings
      parameters:
      - in: query
        name: form_factor
        description: 'The form factor for which global settings are being requested.

          Either form_factor or ssp_type must be provided.

          Required when ssp_type is ATP.

          '
        required: false
        example: LARGE
        schema:
          $ref: '#/components/schemas/FormFactor'
      - in: query
        name: worker_count
        description: 'The number of worker nodes to use for IP pool calculation.

          Only applicable for variable worker count form factors (Medium, Large, Extra-Large).

          Must be within the valid range [min_worker_nodes, max_worker_nodes] for
          the form factor.

          If not provided, min_worker_nodes from the form factor spec is used.

          Ignored for fixed worker count deployments (LICENSING, AVI_OPERATIONS).

          '
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 4
      - in: query
        name: ssp_type
        description: 'The platform instance type. Either form_factor or instance_type
          must be provided.

          - AVI_OPERATIONS: AVI Operations deployment (form_factor is SMALL)

          - ATP: Advanced Threat Protection (requires form_factor parameter)

          '
        required: false
        schema:
          $ref: '#/components/schemas/SspType'
        example: ATP
      responses:
        '200':
          description: Secop global settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettings'
        '400':
          description: 'Bad request. Either form_factor or ssp_type must be provided.

            If ssp_type=ATP is provided, form_factor is required.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'An error occurred while fetching settings.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
  /sspi/platforms/{platform-id}:
    delete:
      tags:
      - instance-management
      summary: Delete and teardown a platform deployment
      description: 'Triggers the asynchronous undeployment and teardown of the specified
        platform cluster.


        **Behavior and Side Effects:**

        * Executing this endpoint will immediately begin destroying the underlying
        Kubernetes cluster, VMs, and associated resources.

        * The workflow is asynchronous. The `status` endpoint will reflect the teardown
        progress.

        * Upon successful completion of the undeployment workflow, the platform record
        is deleted and subsequent calls to the `status` endpoint will return a `404
        Not Found`.


        **Actions:**

        * Passing `action=force_delete` will bypass graceful teardown steps and forcibly
        delete the Platform deployment and database records, ignoring standard cleanup
        failures.

        '
      operationId: DeletePlatform
      parameters:
      - in: path
        name: platform-id
        description: A globally unique UUID representing the platform to delete.
        example: 434348d8-681e-4809-8dc1-427127d2bee7
        required: true
        schema:
          type: string
      - in: query
        name: action
        required: false
        example: force_delete
        description: Specify an action override (e.g., `force_delete` to bypass graceful
          termination errors).
        schema:
          type: string
          enum:
          - force_delete
      responses:
        '202':
          description: 'The platform action request has been accepted.

            Use the returned platform ID and status URL to query for more detailed
            information.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'An error occurred while checking the Platform Installer service.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
    get:
      tags:
      - instance-management
      summary: Get full platform configuration by ID
      description: 'Retrieves the complete, detailed configuration specification for
        a specific platform deployment.

        This includes compute, network, service, and system configurations.

        '
      operationId: GetPlatformConfig
      parameters:
      - in: path
        name: platform-id
        description: A globally unique UUID representing the platform. This is the
          ID returned when initially calling `POST /sspi/platforms`.
        required: true
        example: 434348d8-681e-4809-8dc1-427127d2bee7
        schema:
          type: string
      responses:
        '200':
          description: The platform configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformFullConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'An error occurred while checking the SSPI service.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
    put:
      tags:
      - instance-management
      summary: Update configuration or scale an existing platform deployment
      description: 'Updates the platform configuration and triggers the appropriate
        Lifecycle Management (LCM) workflow asynchronously.


        **Behavior:**

        * **Fresh Platform (Not Deployed):** If the platform record exists but the
        cluster hasn''t been deployed yet, this updates the configuration and immediately
        triggers the initial deployment workflow.

        * **Deployed Platform (Day-2 Operation):** If the platform is already running,
        this saves the updated configuration and triggers a Day-2 configuration update
        workflow (e.g., scaling out worker nodes, modifying features).


        **Workflow Chain:**

        The response returns a `202 Accepted` with a `status_url`. Call `GET /sspi/platforms/{platform-id}/status`
        to poll the update/deployment progress.

        '
      operationId: UpdatePlatformConfig
      parameters:
      - in: path
        name: platform-id
        description: A globally unique UUID representing the platform to update.
        example: 434348d8-681e-4809-8dc1-427127d2bee7
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: The modified platform configuration to apply.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformFullConfig'
            example:
              _revision: 1
              compute:
                cluster_id: domain-c9
                content_datastore_id: datastore-45
                datacenter_id: datacenter-3
                enable_resource_reservation: true
                resource_pool_id: resgroup-46
                ssp_resource_pool_id: resgroup-86
                storage_policy_id: aa6d5a82-1c88-45da-85d3-3d74b91a5bad
              desired_state: START
              network:
                dns:
                - dns.broadcom.example
                network_configs:
                - network_id: dvs-47
                  node_pools:
                  - end: 172.16.111.66
                    name: node-pool-name-1
                    start: 172.16.111.43
                  platform_default_gateway: 172.16.111.1
                  platform_subnet: 172.16.111.1/24
                  portgroup_id: dvportgroup-49
                  service_pools:
                  - end: 172.16.111.89
                    name: service-ippool-name-1
                    start: 172.16.111.71
                ntp: ntp.broadcom.example
                search_domain: searchdomain.example
              provider_id: 8289450b-f562-4ee5-9a40-dd840307319b
              service:
                addon_ids:
                - b39360db-b6a8-4894-abfb-0dae59ac9d00
                - 3e9fff83-75b9-4dde-90a6-ddf4d9e0f539
                ingress_fqdn: ingress-fqdn.example
                instance_name: instance-name-example
                kafka_fqdn: kafka-fqdn.example
                preserve_addons: false
                ssp_bundle_id: 061352f8-b306-46a6-81fd-fe2998176c66
              system:
                controller_count: 3
                form_factor: LARGE
                ssp_type: ATP
                worker_count: 5
      responses:
        '202':
          description: 'The platform action request has been accepted.

            Use the returned platform ID and status URL to query for more detailed
            information.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
              example:
                id: 434348d8-681e-4809-8dc1-427127d2bee7
                status_url: https://sspi.example.com/sspi/platforms/434348d8-681e-4809-8dc1-427127d2bee7/status
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'An error occurred while checking the SSPI service.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
  /sspi/platforms/{platform-id}/status:
    get:
      tags:
      - instance-management
      summary: Poll LCM workflow status and precheck results
      description: 'Retrieves the real-time execution status of any active precheck
        or Lifecycle Management (LCM) workflows for the platform.


        **Workflow Chain:**

        This endpoint is the standard polling mechanism used after triggering asynchronous
        operations like `POST /sspi/platforms`, `PUT /sspi/platforms/{platform-id}`,
        or `DELETE /sspi/platforms/{platform-id}`.


        **Returns:**

        * Overall status of the active job (`IN_PROGRESS`, `COMPLETED`, `FAILED`,
        etc.).

        * Detailed step-by-step precheck results and their individual pass/fail states.

        '
      operationId: GetPlatformLcmStatus
      parameters:
      - in: path
        name: platform-id
        description: A globally unique UUID representing the platform.
        example: 434348d8-681e-4809-8dc1-427127d2bee7
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'An error occurred while checking the Platform Installer service.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
  /sspi/platforms/{platform-id}/health:
    get:
      tags:
      - diagnostic
      summary: Retrieve high-level installer health status for the platform
      description: 'Returns the overall high-level health state of the platform deployment
        as perceived by the installer.


        **Notes:**

        * This is an installer-centric view of health. For detailed, granular cluster
        health metrics, use the `ssp/cluster/monitor/platform/status` API from the
        corresponding Platform instead.

        '
      operationId: GetPlatformHealthStatus
      parameters:
      - in: path
        name: platform-id
        description: A globally unique UUID representing the platform.
        required: true
        example: 434348d8-681e-4809-8dc1-427127d2bee7
        schema:
          type: string
      responses:
        '200':
          description: Platform health status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformHealthStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - enterprise_admin: []
      - auditor: []
  /sspi/info:
    get:
      tags:
      - diagnostic
      summary: Retrieve Installer Appliance metadata and version
      description: 'Returns diagnostic information about the Platform Installer appliance
        itself.


        **Returns:**

        * FQDN of the installer appliance.

        * Active software version of the installer.

        * Current operational status of the installer daemon.


        **Notes:**

        * This endpoint is independent and does not require any deployed Platform
        instances to function.

        '
      operationId: GetInstallerInfo
      responses:
        '200':
          description: Installer information retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallerInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
