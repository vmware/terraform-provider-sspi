  /sspi/upgrade:
    get:
      tags:
      - sspi-upgrade
      summary: List available pre-checks and upgrade step definitions
      description: 'Retrieves the list of all pre-checks and upgrade step definitions.

        This endpoint provides visibility into the upgrade workflow phases and

        pre-checks validations that will be executed, enabling the UI to display

        the upgrade process to the user before execution.


        The steps are listed in the order they will be executed during the upgrade

        process. This endpoint returns step definitions only, not execution status.

        To retrieve execution status and progress, use GET /upgrade/status.

        '
      operationId: ListSspiUpgradeSteps
      responses:
        '200':
          description: 'Upgrade step definitions retrieved successfully. The response
            contains

            a list of all upgrade step definitions in the order they will execute.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SspiUpgradeStepList'
              examples:
                sspi_upgrade_steps:
                  summary: Upgrade step definitions with pre-checks
                  value:
                    results:
                    - id: Prepare for upgrade
                      display_name: Prepare for upgrade
                      description: This step prepares the node for the upgrade. It
                        includes extracting upgrade bundle, backing up the required
                        configuration, and updating the node configuration.
                    - id: Security Services Platform - Cluster Upgrade
                      display_name: Security Services Platform - Cluster Upgrade
                      description: This step upgrades the management cluster and all
                        workload clusters in interleaved phases.
                    - id: Security Services Platform Installer - VM Upgrade
                      display_name: Security Services Platform Installer - VM Upgrade
                      description: This step upgrades the Security Services Platform
                        Installer VM. The VM will get rebooted as part of upgrade
                        progress and it can make UI unavailable for some time. This
                        step may take some time.
                    pre_checks:
                    - id: Management Cluster Health
                      display_name: Management Cluster Health
                      description: Checks the management cluster health, including
                        API server readiness, node status, and control plane pod health
                    - id: Security Services Platform
                      display_name: Security Services Platform
                      description: Checks the Security Services Platform for upgrade
                        readiness, including platform deployment status and version
                        compatibility
                    - id: SSP Cluster Health
