      security:
      - enterprise_admin: []
      - auditor: []
    post:
      tags:
      - sspi-upgrade
      summary: Execute appliance upgrade operation
      description: "Executes the appliance upgrade operation to transition the system\
        \ to the target\nversion based on the specified action. This asynchronous\
        \ operation\norchestrates the complete upgrade workflow including management\
        \ cluster,\nworkload clusters, and appliance VM.\n\nSupported actions:\n\n\
        PRECHECKS_ONLY: Runs only pre-upgrade validation checks without performing\n\
        the upgrade. This operation is idempotent and non-disruptive; it can be\n\
        safely run on a live production system to assess readiness before a\nmaintenance\
        \ window. PRECHECKS_ONLY is only allowed when the upgrade\nstatus is NOT_STARTED.\
        \ Only one pre-checks operation can run at a time.\n\nSTART: Runs pre-checks\
        \ followed by the full upgrade. This is the standard\nupgrade flow. START\
        \ is only allowed when the upgrade status is\nNOT_STARTED. Requires a scheduled\
        \ maintenance window as the appliance VM will\nreboot during the upgrade,\
        \ causing temporary unavailability of the\nmanagement interface. Ensure a\
        \ backup is taken before initiating. Do not\ninterrupt the upgrade process\
        \ once initiated unless absolutely necessary\nfor emergency recovery.\n\n\
        CONTINUE: Starts the upgrade without running pre-checks. CONTINUE is\nonly\
        \ allowed when the upgrade status is NOT_STARTED and pre-checks\nhave completed\
        \ successfully, returns an error for any other state.\n\nRETRY: Resumes the\
        \ upgrade workflow from the failed step. Already\ncompleted upgrade steps\
        \ are skipped automatically. RETRY is only\nallowed when the upgrade status\
        \ is FAILED, which means pre-checks\nhave already passed. If pre-checks failed,\
        \ use START again.\n\nPrerequisites:\n- Upgrade Manager must be upgraded to\
        \ target version\n  (POST /upgrade/manager?action=upgrade)\n- A valid upgrade\
        \ package must be available\n\nRecommended workflow:\n\n1. Check versions\
        \ (GET /upgrade/version-summary), review packages\n   (GET /upgrade/packages),\
        \ and upgrade the Upgrade Manager\n   (POST /upgrade/manager).\n2. Run pre-checks\
        \ (POST /upgrade?action=PRECHECKS_ONLY) and review\n   results (GET /upgrade/status).\n\
        3. During a maintenance window, start the upgrade\n   (POST /upgrade?action=START\
        \ or POST /upgrade?action=CONTINUE if\n   pre-checks already passed), and\
        \ monitor progress\n   (GET /upgrade/status).\n4. If upgrade fails, address\
        \ the issue and retry\n   (POST /upgrade?action=RETRY).\n5. Review upgrade\
        \ history (GET /upgrade/history) after completion.\n"
      operationId: TriggerSspiUpgrade
      parameters:
      - name: action
        in: query
        required: true
        description: 'The upgrade action to perform.


          PRECHECKS_ONLY: Runs only pre-upgrade validation checks (idempotent). PRECHECKS_ONLY
          can only be performed when the upgrade status is NOT_STARTED. Only one pre-checks
          operation can run at a time.

          START: Runs pre-checks followed by the full upgrade. START can only be performed
          when the upgrade status is NOT_STARTED.

          CONTINUE: Starts the upgrade without pre-checks. CONTINUE can only be used
          when the upgrade status is NOT_STARTED and pre-checks have completed successfully.

          RETRY: Resumes the upgrade workflow from the failed step, skipping completed
          steps. RETRY can only be used when the upgrade status is FAILED.

          '
        schema:
          $ref: '#/components/schemas/UpgradeAction'
      responses:
        '202':
          description: 'Upgrade or pre-checks operation has been accepted and initiated.
            The

            operation is executing asynchronously. Use the status_url in the response

            to monitor progress and track completion.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
        '400':
          description: 'The system does not meet prerequisites for the requested action.

            Possible reasons include: the upgrade status does not permit the

            requested action (e.g., RETRY when upgrade is not FAILED, CONTINUE

            when pre-checks have not completed successfully), the Upgrade Manager

            has not been upgraded, or the action parameter is invalid.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflict. An upgrade or pre-checks operation is already in
            progress.

            Monitor the current operation using GET /upgrade/status.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'Unexpected error occurred while initiating the upgrade or
            pre-checks

            operation. Consult the error response details and system logs for

            diagnostic information.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
  /sspi/upgrade/status:
    get:
      tags:
      - sspi-upgrade
      summary: Retrieve upgrade operation status and progress
      description: 'Retrieves real-time status and detailed progress information for
        the

        upgrade operation. This endpoint provides visibility into upgrade

        execution with granular reporting for each upgrade phase.


        Poll this endpoint at regular intervals while upgrade is in progress.


        Upon completion, verify that overall_status is SUCCESS. If status is FAILED,

        examine the upgrade_steps array for the failed step to identify root cause

        or connect with VMware Support for assistance.


        If no upgrade has been initiated, the response indicates NOT_STARTED status.


        Note: During the appliance VM upgrade phase, the system will reboot and this

        endpoint may be temporarily unavailable. Resume polling after the system

        comes back online.

        '
      operationId: GetSspiUpgradeStatus
