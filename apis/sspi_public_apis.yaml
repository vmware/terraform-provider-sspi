          enum:
          - UNKNOWN
          - NOT_STARTED
          - QUEUED
          - RUNNING
          - STOPPING
          - STOPPED
          - FAILED
          - ROLLBACK_QUEUED
          - ROLLBACK_RUNNING
          - ROLLBACK_STOPPING
          - ROLLBACK_STOPPED
          - ROLLBACK_FAILED
          - ROLLBACK_COMPLETED
          - ABORTED
          - COMPLETED
        phase:
          type: string
          title: Workflow Phase
          description: The current phase of the workflow.
          enum:
          - DRAFT
          - EXECUTE
          - COMPLETE
          - DELETE
          - UPDATE
        jobs:
          type: array
          title: Workflow Jobs
          items:
            $ref: '#/components/schemas/JobResult'
          description: A list of job states that belong to this workflow.
