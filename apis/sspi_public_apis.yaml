          - COMPLETED
    GlobalSettings:
      title: Global secop settings
      description: The global settings for secop. This is a read-only response schema.
      type: object
      additionalProperties: false
      properties:
        max_controller_node:
          type: integer
          format: int64
          title: Max Supported Controller Nodes
          description: This is the max number of controller nodes supported.
          readOnly: true
        min_controller_node:
          type: integer
          format: int64
          title: Minimum Supported Controller Nodes
          description: This is the minimum number of controller nodes supported.
          readOnly: true
        max_worker_node:
          type: integer
          format: int64
          title: Max Supported Worker Nodes
          description: This is the max number of worker nodes supported.
          readOnly: true
        min_worker_node:
          type: integer
          format: int64
          title: Minimum Supported Worker Nodes
          description: This is the minimum number of worker nodes supported.
          readOnly: true
        min_node_ip_pool_count:
          type: integer
          format: int64
          title: Minimum Node IP Pool Count
          description: 'The minimum number of IPs required in the Node IP Pool. Calculated
            as:

            2 (1 for VIP + 1 for rolling upgrade) + controller_count + worker_count.

            Uses min_worker_nodes if worker_count query parameter is not provided.

            '
          readOnly: true
        min_service_ip_pool_count:
          type: integer
          format: int64
          title: Minimum Service IP Pool Count
          description: 'The minimum number of IPs required in the Service IP Pool.
            Calculation varies by deployment:

            - Licensing/AVI Operations/Evaluation: 3 IPs (1 Contour + 1 kafka-external
            + 1 kafka broker)

            - Medium: 5 IPs (1 Contour + 1 kafka-external + 3 kafka brokers hardcoded)

            - Large/Extra-Large: 3 + ceil(worker_count/2) for extra kafka brokers

            Uses min_worker_nodes if worker_count query parameter is not provided.

            '
          readOnly: true
    BackupConfig:
      title: Remote backup server configuration
      description: SFTP target host, credentials, and folder where backup bundles
        are stored.
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        title: Connection details for the backup repository
        description: Required fields define where the installer writes backups.
        required:
        - server_address
        - protocol
        - port
        - username
        - backup_location
        - ssh_public_key
        - password
        properties:
          server_address:
            title: Server Address
            type: string
            maxLength: 255
            description: FQDN or IP address of backup server
          protocol:
            title: Protocol
            type: string
            enum:
            - SFTP
            description: File transfer protocol supported by backup server
          port:
            title: Port
            type: integer
            minimum: 1
            maximum: 65535
            description: Configured port for proxy
          username:
            title: Username
            type: string
            description: User name for ssh access to file server
            minLength: 3
            maxLength: 30
          ssh_public_key:
            title: SSH Public Key
            type: string
            description: The SSH public key of the file server
          backup_location:
            title: Backup Location
            type: string
            description: Directory in backup server
          password:
            title: Password
            type: string
            format: password
            writeOnly: true
            minLength: 6
            maxLength: 255
            description: Password for file server authentication
          passphrase:
            title: Passphrase
            type: string
            format: password
            writeOnly: true
            description: Passphrase to secure backup bundle file
            minLength: 12
            maxLength: 255
    RecurringBackupConfig:
      title: Scheduled (recurring) backup policy
      description: Whether automated backups run, full backup type, and weekly or
        interval schedule.
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        title: Automated backup schedule
        description: When enabled, backups run on the configured weekly or interval
          schedule.
        required:
        - enabled
        - backup_type
        - backup_schedule_type
        properties:
          enabled:
            title: Enabled
            type: boolean
            description: Flag to indicate automated backups are enabled or not
          backup_type:
            $ref: '#/components/schemas/BackupType'
          backup_schedule_type:
            $ref: '#/components/schemas/BackupScheduleType'
          backup_schedule_weekly:
            $ref: '#/components/schemas/WeeklyBackupSchedule'
          backup_schedule_interval:
            $ref: '#/components/schemas/IntervalBackupSchedule'
    BackupScheduleType:
      title: Backup Schedule Type
      type: string
      enum:
      - WEEKLY
      - INTERVAL
      description: WEEKLY uses calendar days and time; INTERVAL uses hours between
        runs.
    WeeklyBackupSchedule:
      title: Weekly Backup Schedule
      type: object
      required:
      - days_of_week
      description: Days of week and local time when a WEEKLY scheduled backup runs.
      properties:
        days_of_week:
          title: Days Of Week
          description: Days of week when backup is taken. Sunday, Monday, Tuesday...
          type: array
          items:
            $ref: '#/components/schemas/WeekDay'
          uniqueItems: true
          minItems: 1
          maxItems: 7
        hour_of_day:
          title: Hour Of Day
          description: Hour of day when backup is taken
          type: integer
          minimum: 0
          maximum: 23
          default: 0
        minute_of_day:
          title: Minute Of Day
          description: Minute of hour when backup is taken
          type: integer
          minimum: 0
          maximum: 59
          default: 0
    WeekDay:
      title: Week Day
      type: string
      enum:
      - SUNDAY
      - MONDAY
      - TUESDAY
      - WEDNESDAY
      - THURSDAY
      - FRIDAY
      - SATURDAY
      description: Calendar weekday for weekly schedules.
    IntervalBackupSchedule:
      title: Interval Backup Schedule
      type: object
      description: Hours between starts when using INTERVAL schedule type.
      properties:
        hours_between_backups:
          title: Hours Between Backups
          description: Time interval in hours between two consecutive automated backups
          type: integer
          minimum: 6
          maximum: 720
          default: 168
    BackupTriggerType:
      title: Backup Trigger Type
      type: string
      enum:
      - MANUAL
      - SCHEDULER
      - AUTOMATIC
      description: Whether the backup was started manually or by automation.
    BackupType:
      title: Backup Type
      type: string
      enum:
      - FULL_BACKUP
      description: Backup scope; FULL_BACKUP is the supported type for this API.
    BackupAction:
      title: Backup Action
      type: string
      enum:
      - BACKUP
      description: Must be BACKUP for starting a backup job.
    RestoreAction:
      title: Restore Action
      type: string
      enum:
      - RESTORE
      description: Must be RESTORE for starting a restore job.
    BackupRequest:
      title: Start Backup Request
      type: object
      additionalProperties: false
      description: Body for POST /sspi/backup; requires backup_type and action BACKUP.
      required:
      - backup_type
      - action
      properties:
        id:
          title: Id
          type: string
          description: Unique id for backup
        name:
          title: Name
          type: string
          description: Backup name
          maxLength: 255
        description:
          title: Description
          type: string
          description: Backup description
          maxLength: 255
        backup_type:
          $ref: '#/components/schemas/BackupType'
          description: Backup type for what to take in backup
        action:
          $ref: '#/components/schemas/BackupAction'
          description: Type of backup action
    BackupRestoreStatus:
      title: Backup/Restore Status
      type: string
      enum:
      - SUCCESS
      - FAILED
      - IN_PROGRESS
      - QUEUED
      - NOT_STARTED
      - COMPLETED_WITH_ERRORS
      description: Lifecycle state of a backup or restore job.
    BackupStatus:
      title: Backup job status
      description: Progress, timestamps, version, and per-entity results for one backup
        job.
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        required:
        - id
        - backup_type
        - backup_trigger_type
        - status
        - version
        - error_messages
        - no_of_entities
        - entities_status
        properties:
          backup_start_time:
            $ref: '#/components/schemas/EpochMsTimestamp'
            description: Milliseconds since Unix epoch when the backup started (EpochMsTimestamp).
            readOnly: true
          backup_end_time:
            $ref: '#/components/schemas/EpochMsTimestamp'
            description: Milliseconds since Unix epoch when the backup completed (EpochMsTimestamp).
            readOnly: true
          progress:
            title: Progress
            type: integer
            description: Backup progress, expressed as a percentage from 0 to 100,
              inclusive
            readOnly: true
          progress_message:
            title: Progress Message
            type: string
            description: Backup progress message
            readOnly: true
          backup_type:
            $ref: '#/components/schemas/BackupType'
          backup_trigger_type:
            $ref: '#/components/schemas/BackupTriggerType'
            readOnly: true
          status:
            $ref: '#/components/schemas/BackupRestoreStatus'
            readOnly: true
          file_size:
            title: File Size
            type: integer
            description: Backup file size
            readOnly: true
          version:
            title: Version
            type: string
            description: Deployed version this backup is taken
            readOnly: true
          error_messages:
            title: Error Messages
            type: array
            description: List of error messages encountered during backup operation
            items:
              type: string
            readOnly: true
          no_of_entities:
            title: No Of Entities
            description: number of managed entities
            type: integer
            format: int32
            readOnly: true
          entities_status:
            title: Entities Status
            type: array
            description: Status of backup operation for each managed entity
            items:
              $ref: '#/components/schemas/BackupRestoreManagedEntityStatus'
            readOnly: true
    BackupStatusList:
      title: Backup Status List
      description: 'Paginated list of backup jobs (see ListResult for paging fields).

        '
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        required:
        - result
        properties:
          result:
            title: Result
            type: array
            description: List of backup status records
            items:
              $ref: '#/components/schemas/BackupStatus'
            readOnly: true
    RestoreRequest:
      title: Start Restore Request Common
      type: object
      additionalProperties: false
      description: Body for POST /sspi/restore; requires backup_id and action RESTORE.
      required:
      - backup_id
      - action
      properties:
        id:
          title: Id
          type: string
          description: Unique id of restore
        name:
          title: Name
          type: string
          description: Backup name
          maxLength: 255
        description:
          title: Description
          type: string
          description: Backup description
          maxLength: 255
        backup_id:
          title: Backup Id
          type: string
          description: Unique id of successful backup
        force_restore:
          title: Force Restore
          type: boolean
          default: false
          description: 'Bypasses validation pre-checks during the restore operation.
            If true, the

            system ignores recoverable errors that would otherwise block the restore'
        action:
          $ref: '#/components/schemas/RestoreAction'
    RestoreStatus:
      title: Restore job status
      description: Progress, timestamps, source backup reference, and per-entity results
        for one restore job.
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        required:
        - id
        - backup_id
        - backup_start_time
        - status
        - version
        - error_messages
        - no_of_entities
        - entities_status
        properties:
          backup_id:
            title: Backup Id
            type: string
            description: Unique id of backup
            readOnly: true
          backup_name:
            title: Backup Name
            type: string
            description: Backup name
            readOnly: true
          backup_start_time:
            $ref: '#/components/schemas/EpochMsTimestamp'
            description: Milliseconds since Unix epoch when the source backup started
              (EpochMsTimestamp).
            readOnly: true
          restore_start_time:
            $ref: '#/components/schemas/EpochMsTimestamp'
            description: Milliseconds since Unix epoch when the restore started (EpochMsTimestamp).
            readOnly: true
          restore_end_time:
            $ref: '#/components/schemas/EpochMsTimestamp'
            description: Milliseconds since Unix epoch when the restore completed
              (EpochMsTimestamp).
            readOnly: true
          progress:
            title: Progress
            type: integer
            description: Restore progress, expressed as a percentage from 0 to 100,
              inclusive
            readOnly: true
          progress_message:
            title: Progress Message
            type: string
            description: Restore progress message
            readOnly: true
          status:
            $ref: '#/components/schemas/BackupRestoreStatus'
            description: Status of restore request
            readOnly: true
          version:
            title: Version
            type: string
            description: Deployed version of the backup used in this restore
            readOnly: true
          error_messages:
            title: Error Messages
            type: array
            description: List of error messages encountered during restore operation
            items:
              type: string
            readOnly: true
          no_of_entities:
            title: No Of Entities
            description: number of managed entities
            type: integer
            format: int32
            readOnly: true
          entities_status:
            title: Entities Status
            type: array
            description: Status of restore operation for each managed entity
            items:
              $ref: '#/components/schemas/BackupRestoreManagedEntityStatus'
            readOnly: true
          backup_location:
            title: Backup Location
            type: string
            description: Directory in backup server where the backup was stored
            readOnly: true
          server_address:
            title: Server Address
            type: string
            description: FQDN or IP address of the backup server
            readOnly: true
    RestoreStatusList:
      title: Restore Status List
      description: 'Paginated list of restore jobs (see ListResult for paging fields).

        '
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        required:
        - result
        properties:
          result:
            title: Result
            type: array
            description: List of restore status records
            items:
              $ref: '#/components/schemas/RestoreStatus'
            readOnly: true
    BackupHistoryType:
      title: Backup/Restore History Type
      type: string
      enum:
      - DB
      - SERVER
      description: DB reads job history from the database; SERVER reconciles with
        the remote backup server view.
    BackupDetails:
      title: Extended backup metadata
      description: Snapshot of backup identity, trigger, version, and SSP instance
        details at backup time.
      type: object
      properties:
        backup_id:
          title: Backup ID
          type: string
          description: Unique id of backup
        description:
          title: Description
          type: string
          description: Backup description
        trigger_type:
          title: Trigger Type
          type: string
          description: Backup triggered type
        version:
          title: Version
          type: string
          description: Deployed version of SSPI
        instancesDetails:
          title: Instances Details
          description: 'Details of SSP instances deployed by this SSPI at the time

            the backup was taken

            '
          type: array
          items:
            $ref: '#/components/schemas/SspDetails'
    SspDetails:
      title: Platform instance details at backup time
      description: 'One Platform instance as deployed when the backup was taken (names,
        versions, pools, endpoints).

        '
      type: object
      properties:
        instance:
          title: Instance
          type: string
          description: Platform instance name
        atp_version:
          title: ATP Version
          type: string
          description: Deployed version of Platform
        form_factor:
          title: Form Factor
          $ref: '#/components/schemas/FormFactor'
        controller_count:
          title: Controller Count
          type: integer
          description: Number of controller nodes
        worker_count:
          title: Worker Count
          type: integer
          description: Number of worker nodes
        node_pool:
          title: Node Pool
          description: node ip pools
          type: array
          items:
            $ref: '#/components/schemas/IpPool'
        service_pool:
          title: Service Pool
          description: service ip pools
          type: array
          items:
            $ref: '#/components/schemas/IpPool'
        ingress_fqdn:
          title: Ingress FQDN
          description: FQDN of security service platform
          type: string
        kafka_fqdn:
          title: Kafka FQDN
          description: FQDN of the kafka running in Platform
          type: string
    BackupRestoreManagedEntityStatus:
      title: Managed entity backup or restore outcome
      description: Per-component status and errors for one entity in a backup or restore
        job.
      type: object
      required:
      - id
      - name
      - form_factor
      - status
      - error_messages
      properties:
        id:
          title: ID
          type: string
          description: Unique managed entity ID
        name:
          title: Name
          type: string
          description: Unique entity name
        form_factor:
          $ref: '#/components/schemas/FormFactor'
        status:
          title: Status
          $ref: '#/components/schemas/BackupRestoreStatus'
        error_messages:
          title: Error Messages
          type: array
          description: Error messages pertaining to backup operation on this endpoint
          items:
            type: string
    VsphereProviderDefinitionList:
      title: vSphere Provider Definition List
      description: A list of all vSphere providers.
      type: object
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        properties:
          configs:
            description: A list of all vSphere providers.
            type: array
            items:
              $ref: '#/components/schemas/VsphereProviderDefinition'
            minItems: 0
            maxItems: 3
    VsphereProviderDefinition:
      title: vSphere Provider Definition
      description: The vSphere provider definition.
      type: object
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        required:
        - server
        - user
        - password
        - certificate
        properties:
          server:
            type: string
            title: IP or FQDN of the vSphere
            description: The IP or FQDN of the vSphere.
          user:
            type: string
            title: User for vSphere with Administrative Access
            description: A user for vSphere with administrative access.
          password:
            type: string
            format: password
            title: Password for vSphere User
            description: The password for the vSphere user. This field should be masked
              for read access.
            writeOnly: true
          certificate:
            title: PEM-Encoded Certificate for the vCenter
            description: 'The PEM-encoded certificate for the vCenter.

              '
            type: string
            writeOnly: true
          state:
            title: JSON-Encoded Additional Metadata About the Provider
            description: 'JSON-encoded additional metadata about the provider.

              '
            type: string
            readOnly: true
          instance_id:
            title: Instance ID
            description: The instance ID of the vSphere provider in the Security Service
              Platform Installer.
            type: string
            readOnly: true
    ProviderConnectionStatus:
      title: Provider Connection Status
      description: The provider connection status.
      type: object
      additionalProperties: false
      required:
      - message
      - state
      properties:
        message:
          type: string
          title: Summary of Connection Status
          description: A summary of the connection status.
        state:
          $ref: '#/components/schemas/ProviderConnectionStatusEnum'
    ProviderConnectionStatusEnum:
      title: Provider Connection Status Enum
      description: Enum for the provider connection status.
      type: string
      enum:
      - CONNECTED
      - NOT_CONNECTED
    ProviderStatus:
      title: Provider Status
      description: 'The comprehensive status of the provider, including both connection
        status

        and provider realization workflow status.

        '
      type: object
      additionalProperties: false
      properties:
        provider_id:
          type: string
          title: ID of the Provider
          description: The ID of the provider.
        connection_status:
          $ref: '#/components/schemas/ProviderConnectionStatus'
        workflow_results:
          $ref: '#/components/schemas/WorkflowResult'
    LoginRequest:
      title: Login request
      description: Credentials submitted to `POST /iam/login` to start an authenticated
        session.
      type: object
      required:
      - user_name
      - password
      - user_type
      properties:
        user_name:
          type: string
          title: User name
          description: The user name to authenticate. For LDAP users, this may need
            to include the domain, depending on how the identity source is configured.
        password:
          type: string
          title: Password
          description: The password for `user_name`. Not returned in any response.
        user_type:
          type: string
          title: User type
          description: Whether `user_name` identifies a local account or a remote
            LDAP account/group. Must match how the account was created.
          $ref: '#/components/schemas/UserType'
    LoginAuthResponse:
      title: Login Auth Response
      description: The authenticated user's identity and roles, returned on a successful
        `POST /iam/login`.
      type: object
      properties:
        user_name:
          type: string
          title: User name
          description: The user name that was authenticated.
        display_name:
          type: string
          title: Display Name
          description: The human-readable name for this user, suitable for showing
            in a UI.
        user_type:
          type: string
          title: User Type
          description: Whether this is a local account or a remote LDAP account/group.
          $ref: '#/components/schemas/UserType'
        roles:
          type: array
          title: Roles
          description: The roles held by this user, which determine which Installer
            APIs the current session is authorized to call.
          items:
            $ref: '#/components/schemas/Role'
    ChangePasswordRequest:
      title: ChangePasswordRequest
      description: The current and new password for a self-service password change
        via `POST /iam/change-password`.
      type: object
      properties:
        old_password:
          type: string
          title: Old password
          description: The user's current password. Required to prove ownership of
            the account before it is changed.
        new_password:
          type: string
          title: New password
          description: The password to set. Must satisfy the configured password policy,
            or the request is rejected with `400`.
    ResetPasswordRequest:
      title: ResetPasswordRequest
      description: The target user and new password for an administrator-driven password
        reset via `POST /iam/reset-password`.
      type: object
      required:
      - user_name
      - new_password
      properties:
        user_name:
          type: string
          title: User name
          description: The local user whose password is being reset. Remote (LDAP)
            users cannot be targeted, since their password is not managed by Installer.
        new_password:
          type: string
          title: New password
          description: The password to set for `user_name`. Must satisfy the configured
            password policy, or the request is rejected with `400`.
    Role:
      title: Role
      description: A single role held by a user or group, as returned by the IAM APIs.
      type: object
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/SspInstallerRole'
        display_name:
          type: string
          title: Role Display Name
          description: The human-readable name for this role, suitable for showing
            in a UI.
    RoleList:
      title: Role List
      description: A page of the roles available to be assigned in Installer, as returned
        by `GET /iam/roles`.
      type: object
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        properties:
          results:
            type: array
            title: Results
            description: The roles in this page of results.
            items:
              $ref: '#/components/schemas/Role'
    UserType:
      title: User Type
      description: 'Identifies whether an identity is a local Installer account, a
        remote user

        authenticated through a configured LDAP identity source, or a remote LDAP
        group.

        '
      type: string
      enum:
      - LOCAL_USER
      - REMOTE_USER
      - REMOTE_GROUP
    PasswordStatus:
      title: Password Status
      description: 'The password expiry state of a local user, included so a UI can
        prompt the user to

        change their password before it expires.

        * `ACTIVE`: The password is valid and not expired.

        * `EXPIRED`: The password has expired; the user must change it via `POST /iam/change-password`
        before continuing.

        * `INVALID`: Not applicable - the account''s password isn''t managed by Installer
        (for example, a remote LDAP user).

        '
      type: string
      enum:
      - ACTIVE
      - EXPIRED
      - INVALID
    UserInfo:
      title: User Info
      description: The identity, type, and roles of an authenticated user, as returned
        by `GET /iam/current-user-info`.
      type: object
      properties:
        name:
          type: string
          title: Name
          description: The user or group's name.
        display_name:
          type: string
          title: Display Name
          description: The human-readable name for this user or group, suitable for
            showing in a UI.
        user_type:
          type: string
          title: User Type
          description: Whether this is a local account or a remote LDAP account/group.
          $ref: '#/components/schemas/UserType'
        password_status:
          type: string
          title: Password Status
          description: Whether the user's local password is active or expired. Only
            meaningful for local users.
          $ref: '#/components/schemas/PasswordStatus'
        password_expiration_timestamp:
          title: Password Expiration Timestamp
          description: When this user's password will expire, in epoch milliseconds.
            Omitted if the password does not expire or the user is not a local user.
          $ref: '#/components/schemas/EpochMsTimestamp'
        roles:
          type: array
          title: Roles
          description: The roles currently assigned to this user or group.
          items:
            $ref: '#/components/schemas/Role'
    UserInfoList:
      title: User Info List
      description: A page of users and groups matching a `GET /iam/users` query.
      type: object
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        properties:
          results:
            type: array
            title: Results
            description: The users and groups in this page of results.
            items:
              $ref: '#/components/schemas/UserInfo'
    RoleBinding:
      title: Role Binding
      description: The set of roles granted to a single local user, remote user, or
        remote group.
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        required:
        - entity_name
        - roles
        properties:
          entity_name:
            type: string
            title: Entity Name
            description: 'The user or group being granted roles. For local users this
              is the user name; for

              LDAP users and groups this is typically the principal name returned
              by

              `GET /iam/ldap-identity-sources/search`.

              '
          user_type:
            title: User Type
            $ref: '#/components/schemas/UserType'
          roles:
            type: array
            title: Roles
            description: The roles to grant to `entity_name`. On `PUT`, this list
              fully replaces the entity's existing roles.
            items:
              $ref: '#/components/schemas/Role'
    RoleBindingList:
      title: Role Binding List
      description: A page of role bindings matching a `GET /iam/role-bindings` query.
      type: object
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        properties:
          results:
            type: array
            title: Results
            description: The role bindings in this page of results.
            items:
              $ref: '#/components/schemas/RoleBinding'
    LdapType:
      title: LDAP Type
      description: The LDAP server implementation to connect to, which determines
        the expected format of `bind_identity` and other server-specific behavior.
      type: string
      enum:
      - ACTIVE_DIRECTORY
      - OPEN_LDAP
    LdapIdentitySource:
      title: LDAP Identity Source
      description: 'Configuration for authenticating users and groups against an LDAP
        directory (Active

        Directory or OpenLDAP), including the server to connect to and the credentials

        Installer uses to search it.

        '
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        required:
        - domain_name
        - base_distinguished_name
        - ldap_server
        - ldap_type
        properties:
          domain_name:
            type: string
            title: Authentication domain name
            description: The domain suffix users provide at login (for example `corp.example.com`)
              that routes them to this identity source.
          alternative_domain_names:
            type: array
            title: Alternative Domain Names
            description: Additional domain suffixes that should also be routed to
              this identity source, for environments with multiple accepted domains.
            items:
              type: string
          ldap_type:
            $ref: '#/components/schemas/LdapType'
          base_distinguished_name:
            type: string
            title: Base DN
            description: The distinguished name of the subtree to search for users
              and groups (for example `dc=corp,dc=example,dc=com`).
          ldap_server:
            $ref: '#/components/schemas/LdapIdentitySourceServer'
          connectivity_result:
            $ref: '#/components/schemas/LdapIdentitySourceConnectivityResult'
    LdapIdentitySourceList:
      title: List LDAP Identity Source
      description: A page of LDAP identity sources matching a `GET /iam/ldap-identity-sources`
        query.
      type: object
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        properties:
          results:
            type: array
            title: Results
            description: The LDAP identity sources in this page of results.
            items:
              $ref: '#/components/schemas/LdapIdentitySource'
    LdapIdentitySearchItem:
      title: Ldap Identity Search Item
      description: A single user or group matched by `GET /iam/ldap-identity-sources/search`.
      type: object
      required:
      - common_name
      - distinguished_name
      - user_type
      properties:
        common_name:
          type: string
          title: Common Name
          description: The entry's Common Name (CN) attribute, if the directory populates
            one.
        distinguished_name:
          type: string
          title: Distinguished Name
          description: The entry's full Distinguished Name (DN). Can be used as `entity_name`
            when granting a role via `POST /iam/role-bindings`.
        principal_name:
          type: string
          title: Principal Name
          description: 'The entry''s user principal name (for example `sspuser1@corp.example.com`),
            if the directory

            populates one. Prefer this over `distinguished_name` as `entity_name`
            when available, since

            it is typically more stable.

            '
        user_type:
          $ref: '#/components/schemas/UserType'
    LdapIdentitySearchResults:
      title: Ldap Identity Search Results
      description: A page of results from `GET /iam/ldap-identity-sources/search`.
      type: object
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        properties:
          results:
            type: array
            title: Results
            description: The users and groups in this page of search results.
            items:
              $ref: '#/components/schemas/LdapIdentitySearchItem'
    LdapProbeError:
      title: Error detail from probe
      description: One error encountered while Installer probed connectivity to an
        LDAP server.
      type: object
      required:
      - error_type
      - message
      properties:
        error_type:
          $ref: '#/components/schemas/LdapProbeErrorType'
        message:
          type: string
          title: Message
          description: A human-readable explanation of `error_type`.
    LdapProbeErrorType:
      type: string
      title: Ldap Probe Error Type
      description: "The reason an LDAP connectivity probe failed, returned in `LdapProbeError.error_type`\
        \ and\nused to guide what to fix in the identity source configuration.\nBASE_DN_NOT_FOUND:\
        \ The configured base DN does not exist on the\n    LDAP server or is not\
        \ readable.\nBIND_DN_AND_PASSWORD_REQUIRED: This server is configured to\n\
        \    require a bind DN and password. Please add these to your\n    LDAP server\
        \ configuration.\nBIND_DN_INVALID: The bind DN or username provided is not\
        \ valid\n    on the LDAP server. Check that the bind DN is correct.\n    This\
        \ error may also indicate that the base DN in your\n    configuration is incorrect.\n\
        CERTIFICATE_HOSTNAME_MISMATCH_ERROR: The hostname configured for\n    the\
        \ LDAP server does not match the hostname in the server's\n    certificate\
        \ subject or alternative subject names. Be sure\n    that the hostname you\
        \ configure in Installer matches one\n    of those names.\nCERTIFICATE_MISMATCH_ERROR:\
        \ The certificate presented by the\n    LDAP server did not match the certificate\
        \ in the configuration\n    on the Installer.\nCONNECTION_REFUSED: The connection\
        \ was refused when contacting the\n    LDAP server. Ensure that the LDAP server\
        \ is running and that\n    you are using the correct ip/hostname.\nCONNECTION_TIMEOUT:\
        \ The connection timed out when contacting\n    the LDAP server. Check the\
        \ hostname/ip and any firewalls\n    between the Installer and the LDAP server.\n\
        GENERAL_ERROR: An undetermined error occurred.\nINVALID_CONFIGURED_CERTIFICATE:\
        \ The certificate configured for\n    this LDAP server is invalid and could\
        \ not be decoded. Check\n    that the PEM-formatted certificate you provided\
        \ is correct.\nINVALID_CREDENTIALS: The username and/or password are incorrect.\n\
        SSL_HANDSHAKE_ERROR: An error occurred while establishing a secure\n    connection\
        \ with the LDAP server. Check that the LDAP server's\n    certificate is correct,\
        \ and that it is using an SSL/TLS\n    cipher suite that is compatible with\
        \ the Installer.\n    This error can also occur if the hostname you have configured\n\
        \    for the LDAP server does not match any of the hostnames in\n    the Subject\
        \ Alternative Name records in the server\n    certificate.\nSTARTTLS_FAILED:\
        \ Unable to use StartTLS to upgrade the connection\n    to use TLS. Ensure\
        \ that the LDAP server supports TLS and if\n    not, use LDAP or LDAPS as\
        \ the protocol.\nUNKNOWN_HOST: The hostname of the LDAP server could not be\n\
        \    resolved.\nNO_ROUTE_TO_HOST: There is no network route to the host.\n\
        BIND_EXCEPTION: A socket to the remote host could not be opened.\nPORT_UNREACHABLE:\
        \ The LDAP port is not open on the remote host.\nBASE_DN_NOT_WITHIN_DOMAIN:\
        \ For Active Directory, the base DN\n    is not a subtree of the Domain Component\
        \ tree corresponding\n    to the LDAP domain. For example, if the domain is\n\
        \    \"example.com\", the baseDN should be \"dc=example, dc=com\"\n    or\
        \ a subtree like \"ou=Users,dc=example,dc=com\".\nLDAP_SERVER_DISABLED: The\
        \ LDAP server is marked as disabled\n    in the Installer configuration and\
        \ will not be used.\n"
      enum:
      - BASE_DN_NOT_FOUND
      - BIND_DN_AND_PASSWORD_REQUIRED
      - BIND_DN_INVALID
      - CERTIFICATE_HOSTNAME_MISMATCH_ERROR
      - CERTIFICATE_MISMATCH_ERROR
      - CONNECTION_REFUSED
      - CONNECTION_TIMEOUT
      - GENERAL_ERROR
      - INVALID_CONFIGURED_CERTIFICATE
      - INVALID_CREDENTIALS
      - SSL_HANDSHAKE_ERROR
      - STARTTLS_FAILED
      - UNKNOWN_HOST
      - NO_ROUTE_TO_HOST
      - BIND_EXCEPTION
      - PORT_UNREACHABLE
      - BASE_DN_NOT_WITHIN_DOMAIN
      - LDAP_SERVER_DISABLED
    LdapIdentitySourceServer:
      title: Ldap Identity Source Server
      description: Connection details for the LDAP server backing an identity source.
      type: object
      required:
      - url
      properties:
        url:
          type: string
          title: URL
          description: The LDAP server URL, including scheme and port (for example
            `ldaps://ldap.corp.example.com:636`). Use the `ldaps://` scheme for TLS.
        certificates:
          type: array
          title: TLS certificate(s) for LDAP server(s)
          description: 'PEM-encoded certificate(s) to trust when connecting to the
            LDAP server. Required

            when creating an LDAP identity source.

            '
          items:
            type: string
        bind_identity:
          type: string
          title: Username or DN for LDAP authentication
          description: 'The account Installer uses to search the directory for users
            and groups, and to look up

            a user''s distinguished name from their login name. Required when creating
            an LDAP

            identity source.


            The expected format depends on `ldap_type`:

            * Active Directory: a userPrincipalName (e.g. `administrator@corp.example.com`)
            or the full distinguished name.

            * OpenLDAP: the distinguished name of the user (e.g. `uid=admin,cn=corp,dc=com`).

            '
        password:
          type: string
          title: LDAP Server Password
          description: The password for `bind_identity`. Not returned in any response.
          writeOnly: true
        enabled:
          type: boolean
          default: false
          title: If true, this LDAP server is enabled
          description: 'Whether this server is actively used to authenticate users.
            Set to `false` to keep the

            configuration without allowing logins through it, for example while troubleshooting.

            '
    LdapIdentitySourceConnectivityResult:
      title: Ldap Identity Source Connectivity Result
      description: The outcome of Installer's most recent attempt to connect to an
        LDAP identity source, returned by the create, update, and get-with-`check_connection_status`
        operations.
      type: object
      required:
      - result
      properties:
        result:
          type: string
          title: Overall result
          description: '`SUCCESS` if Installer could connect to the LDAP server, authenticate
            with the

            configured credentials, and search the configured base DN without error.
            Otherwise

            `FAILURE`, in which case `errors` explains what went wrong.

            '
          enum:
          - SUCCESS
          - FAILURE
        errors:
          type: array
          items:
            $ref: '#/components/schemas/LdapProbeError'
          title: Error details
          description: The specific problems encountered during the connectivity probe.
            Empty when `result` is `SUCCESS`.
    VersionSummary:
      type: object
      title: Version Summary
      description: 'Summary of current appliance component versions and target upgrade
        version.

        This provides a quick overview of the system''s version state.

        '
      required:
      - current
      properties:
        current:
          type: object
          title: Current Versions
          description: Currently installed versions of appliance components.
          required:
          - sspi_version
          - upgrade_manager_version
          properties:
            sspi_version:
              type: string
              title: Current Appliance Version
              description: 'Current version of the appliance (e.g., "5.0.0.0.0.29219505").

                This is the version of the appliance VM and associated Kubernetes
                clusters.

                '
            upgrade_manager_version:
              type: string
              title: Current Upgrade Manager Version
              description: 'Current version of the Upgrade Manager service (e.g.,
                "5.0.0.0.0.29219599").

                The Upgrade Manager is the service that orchestrates appliance upgrades.

                This version may differ from the appliance version.

                '
        target:
          type: object
          title: Target Version
          description: 'Target version for upgrade. This field is null if no upgrade
            has been

            initiated. Once an upgrade is initiated, this field contains the target

            appliance version.

            '
          nullable: true
          properties:
            sspi_version:
              type: string
              title: Target Appliance Version
              description: 'Target version for appliance upgrade (e.g., "5.1.0.0.0.29219600").

                This is the version the system will be upgraded to.

                '
    UpgradePackage:
      type: object
      title: Upgrade Package
      description: 'Represents a single available upgrade package that has been uploaded
        to

        the system.

        '
      required:
      - version
      - package_name
      - package_size
      properties:
        version:
          type: string
          title: Package Version
          description: 'The version contained in this upgrade package (e.g., "5.1.0.0.0.29219600").

            '
        package_name:
          type: string
          title: Package Name
          description: 'The filename of the upgrade bundle (e.g., "upgrade-bundle-5.1.0.0.0.29219600.sub").

            '
        package_size:
          type: string
          title: Package Size
          description: 'The size of the upgrade bundle in human-readable format (e.g.,
            "4.94G").

            '
    UpgradePackageList:
      title: Upgrade Package List
      description: 'List of available upgrade packages that can be used for appliance
        upgrade.

        '
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        required:
        - results
        properties:
          results:
            type: array
            title: Upgrade Packages
            description: Array of available upgrade packages.
            items:
              $ref: '#/components/schemas/UpgradePackage'
      additionalProperties: false
    UpgradeHistory:
      type: object
      title: Upgrade History Record
      description: 'Represents a single upgrade attempt in the system history.

        '
      required:
      - initial_version
      - target_version
      - start_time
      - status
      properties:
        initial_version:
          type: string
          title: Initial Version
          description: 'The appliance version before the upgrade (e.g., "5.0.0.0.0.29219505").

            '
        target_version:
          type: string
          title: Target Version
          description: 'The appliance version after the upgrade (e.g., "5.1.0.0.0.29219600").

            '
        start_time:
          $ref: '#/components/schemas/EpochMsTimestamp'
          title: Start Time
          description: 'Timestamp when the upgrade was initiated.

            '
        end_time:
          $ref: '#/components/schemas/EpochMsTimestamp'
          title: End Time
          description: 'Timestamp when the upgrade completed or failed. This field
            is null

            if the upgrade is still in progress.

            '
          nullable: true
        status:
          type: string
          title: Upgrade Status
          description: 'Status of the upgrade attempt.


            STARTED: Upgrade is in progress.

            COMPLETED: Upgrade completed successfully.

            ORPHANED: Upgrade was interrupted or abandoned (e.g., system failure).

            '
          enum:
          - STARTED
          - COMPLETED
          - ORPHANED
    UpgradeHistoryList:
      title: Upgrade History List
      description: 'List of upgrade history records, sorted by start time in descending

        order (most recent first).

        '
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        required:
        - results
        properties:
          results:
            type: array
            title: History Records
            description: Array of upgrade history records.
            items:
              $ref: '#/components/schemas/UpgradeHistory'
      additionalProperties: false
    UpgradeManagerStep:
      title: Upgrade Manager Step
      description: 'Upgrade Manager step definition that describes a phase in the
        Upgrade Manager

        upgrade workflow. Each step represents a discrete operation in the self-upgrade

        process of the Upgrade Manager service.

        '
      allOf:
      - $ref: '#/components/schemas/AsyncActivity'
      - type: object
        required:
        - id
        - display_name
        - description
      additionalProperties: false
    UpgradeManagerStepList:
      title: Upgrade Manager Step List
      description: 'List of Upgrade Manager upgrade step definitions. This response
        provides

        metadata about all steps that will be executed during the Upgrade Manager

        upgrade operation, in the order they will execute.

        '
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        required:
        - results
        properties:
          results:
            type: array
            title: Upgrade Manager Step Definitions
            description: Ordered array of Upgrade Manager step definitions.
            items:
              $ref: '#/components/schemas/UpgradeManagerStep'
      additionalProperties: false
    UpgradeManagerStepStatus:
      title: Upgrade Manager Step Status
      description: 'Execution status of an Upgrade Manager upgrade step, combining
        the step

        definition with real-time execution state and detailed status messages.

        '
      allOf:
      - $ref: '#/components/schemas/UpgradeManagerStep'
      - $ref: '#/components/schemas/BaseUpgradeStepStatus'
      additionalProperties: false
    UpgradeManagerStatus:
      title: Upgrade Manager Status
      description: 'Aggregated status of the Upgrade Manager upgrade operation, providing

        real-time visibility into upgrade progress with detailed execution status

        for each upgrade step and an overall progress percentage.

        '
      type: object
      required:
      - overall_status
      - upgrade_steps
      - progress_percentage
      properties:
        overall_status:
          $ref: '#/components/schemas/BaseUpgradeStatus'
          title: Overall Status
          description: 'Aggregated status of the entire Upgrade Manager upgrade operation.


            NOT_STARTED: Upgrade has not been initiated.

            IN_PROGRESS: Upgrade is actively executing.

            SUCCESS: All upgrade steps completed successfully.

            FAILED: One or more upgrade steps failed.

            '
        upgrade_steps:
          type: array
          title: Upgrade Step Execution Status
          description: 'Ordered sequence of all Upgrade Manager upgrade steps with
            their

            individual execution status and messages. Steps are listed in the

            order they are executed.

            '
          items:
            $ref: '#/components/schemas/UpgradeManagerStepStatus'
        progress_percentage:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          title: Progress Percentage
          description: 'Overall progress of the Upgrade Manager upgrade as a percentage
            (0-100).

            This is calculated based on the number of completed steps.

            '
        current_step:
          type: string
          title: Current Step
          description: 'Name of the upgrade step currently being executed. This field
            is only

            present when the upgrade is in progress (overall_status is IN_PROGRESS).

            '
          nullable: true
      additionalProperties: false
    UpgradeManagerRequest:
      type: object
      title: Upgrade Manager Request
      description: 'Request body for initiating an Upgrade Manager upgrade operation.

        '
      required:
      - target_version
      properties:
        target_version:
          type: string
          title: Target Version
          description: 'The target appliance version to upgrade to (e.g., "5.1.0.0.0.29219600").

            This must match one of the versions available in the upgrade packages.

            '
    SspiUpgradePrecheck:
      title: Pre-Check
      description: 'Pre-check validation definition that describes a specific system
        readiness

        assessment for appliance upgrade. Pre-checks are designed to identify potential

        issues before beginning the upgrade process, enabling early problem detection

        and resolution.

        '
      allOf:
      - $ref: '#/components/schemas/AsyncActivity'
      - type: object
        required:
        - id
        - display_name
        - description
      additionalProperties: false
    SspiUpgradePrecheckList:
      title: Pre-Checks List
      description: 'List of available pre-checks validation definitions. This response
        provides

        metadata about all pre-checks that will be executed during pre-upgrade

        validation.

        '
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        required:
        - results
        properties:
          results:
            type: array
            title: Pre-Checks Definitions
            description: Array of pre-checks validation definitions.
            items:
              $ref: '#/components/schemas/SspiUpgradePrecheck'
      additionalProperties: false
    SspiUpgradePrecheckStepStatus:
      title: Pre-Check Step Status
      description: 'Execution status of a pre-check validation step, combining the
        pre-check

        definition with real-time execution state and detailed status messages.


        Pre-checks are designed to fail fast, identifying problems early before any

        system modifications occur. This prevents partial upgrades and reduces the

        risk of system downtime. Pre-checks can be executed multiple times (idempotent)

        and can be re-run after addressing issues.

        '
      allOf:
      - $ref: '#/components/schemas/SspiUpgradePrecheck'
      - $ref: '#/components/schemas/BaseUpgradeStepStatus'
      additionalProperties: false
    SspiUpgradePreChecksStatus:
      title: Pre-Checks Status
      description: 'Aggregated status of all pre-checks validations, providing a complete
        view

        of system readiness for appliance upgrade along with detailed execution status

        for each individual pre-check.

        '
      type: object
      required:
      - overall_status
      - pre_checks
      properties:
        overall_status:
          $ref: '#/components/schemas/BaseUpgradeStatus'
          title: Overall Pre-Checks Status
          description: 'Aggregated status across all pre-checks, representing the
            overall

            readiness of the system for upgrade.


            NOT_STARTED: Pre-checks have not been initiated.

            IN_PROGRESS: One or more pre-checks are currently executing.

            SUCCESS: All pre-checks passed with no issues detected.

            SUCCESS_WITH_WARNING: All pre-checks completed successfully but some

            identified non-critical concerns. Review WARNING messages before proceeding.

            FAILED: One or more pre-checks failed due to critical issues. The system

            is not ready for upgrade. Address the issues and re-run pre-checks.

            '
        pre_checks:
          type: array
          title: Pre-Checks Execution Status
          description: 'Detailed execution status for each individual pre-checks validation.

            Each entry combines the pre-checks definition with real-time execution
            state.

            '
          items:
            $ref: '#/components/schemas/SspiUpgradePrecheckStepStatus'
      additionalProperties: false
    SspiUpgradeStep:
      title: Upgrade Step
      description: 'Upgrade step definition that describes a major phase in the upgrade

        workflow. Each step represents a high-level category of upgrade operations

        (e.g., preparation, management cluster upgrade, workload cluster upgrade,

        appliance VM upgrade). Steps execute according to internal dependencies and

        orchestration logic.

        '
      allOf:
      - $ref: '#/components/schemas/AsyncActivity'
      - type: object
        required:
        - id
        - display_name
        - description
      additionalProperties: false
    SspiUpgradeStepList:
      title: Upgrade Step List
      description: 'List of pre-checks validation definitions and upgrade step definitions.

        This response provides metadata about all pre-checks and upgrade steps

        that will be executed during the upgrade operation, in the order

        they will execute.

        '
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        required:
        - results
        properties:
          results:
            type: array
            title: Upgrade Step Definitions
            description: Ordered array of upgrade step definitions.
            items:
              $ref: '#/components/schemas/SspiUpgradeStep'
          pre_checks:
            type: array
            title: Pre-Checks Definitions
            description: 'Array of pre-checks validation definitions that will be
              executed

              before the upgrade. Pre-checks assess system readiness and

              identify potential issues.

              '
            items:
              $ref: '#/components/schemas/SspiUpgradePrecheck'
      additionalProperties: false
    SspiUpgradeStepStatus:
      title: Upgrade Step Status
      description: 'Execution status of an upgrade step, combining the step definition

        with real-time execution state and detailed status messages.


        Upgrade steps transform the system from the current version to the

        target version through a series of coordinated operations. Steps may execute

        sequentially or in parallel based on internal dependencies.


        Unlike pre-checks, upgrade steps modify the system. Monitor progress carefully

        and do not interrupt the upgrade process unless absolutely necessary.

        '
      allOf:
      - $ref: '#/components/schemas/SspiUpgradeStep'
      - $ref: '#/components/schemas/BaseUpgradeStepStatus'
      additionalProperties: false
    SspiUpgradeStatus:
      title: Upgrade Status
      description: 'Aggregated status of the upgrade operation, providing real-time

        visibility into upgrade progress and detailed execution status for each

        upgrade step. The upgrade process is asynchronous and may take significant

        time depending on system size and configuration.

        '
      type: object
      required:
      - current_version
      - target_version
      - overall_status
      - upgrade_steps
      properties:
        current_version:
          type: string
          title: Current Version
          description: 'Current version of the appliance before upgrade. This field
            indicates

            the version from which the system is being upgraded.


            This field is always present and populated, even when upgrade status is

            NOT_STARTED, indicating the currently running system version.

            '
          readOnly: true
        target_version:
          type: string
          title: Target Version
          description: 'Target version of the appliance after upgrade completion.
            This field

            indicates the version to which the system will be upgraded.


            This field is always present and populated, indicating the version that

            will be installed when the upgrade completes successfully.

            '
          readOnly: true
        overall_status:
          $ref: '#/components/schemas/BaseUpgradeStatus'
          title: Overall Upgrade Status
          description: 'Aggregated status of the entire upgrade operation, computed
            from

            individual step results.


            NOT_STARTED: Upgrade has not been initiated.

            IN_PROGRESS: Upgrade is actively executing. One or more steps are running.

            SUCCESS: All upgrade steps completed successfully.

            FAILED: One or more upgrade steps failed. Review ERROR messages in the

            failed steps or connect with VMware Support for assistance.

            '
        upgrade_steps:
          type: array
          title: Upgrade Step Execution Status
          description: 'Ordered sequence of all upgrade steps with their individual

            execution status and messages. Each entry combines the step definition

            with real-time execution state. Steps are listed in the order they

            are executed.


            Monitor individual steps to track upgrade progress, identify which step

            is currently executing, determine which step failed if upgrade fails,

            and review progress messages for long-running steps.

            '
          items:
            $ref: '#/components/schemas/SspiUpgradeStepStatus'
        pre_checks_status:
          $ref: '#/components/schemas/SspiUpgradePreChecksStatus'
          title: Pre-Checks Status
          description: 'Aggregated status of all pre-checks validations. This field
            provides

            the results of pre-upgrade validation checks, including overall

            pre-checks status and detailed results for each individual pre-check.


            This field is present when pre-checks have been executed, either

            standalone via POST /upgrade?pre_checks_only=true or as part of

            a full upgrade via POST /upgrade.

            '
          nullable: true
      additionalProperties: false
    UpgradeAction:
      title: Upgrade Action
      description: 'The upgrade action to perform.

        '
      type: string
      enum:
      - PRECHECKS_ONLY
      - START
      - CONTINUE
      - RETRY
    BaseUpgradeStatus:
      title: Base Status
      description: Execution state of an operation.
      type: string
      readOnly: true
      enum:
      - NOT_STARTED
      - IN_PROGRESS
      - SUCCESS
      - SUCCESS_WITH_WARNINGS
      - FAILED
      - SKIPPED
      - PAUSED
    BaseUpgradeStatusMessage:
      type: object
      title: Base Status Message
      description: 'Individual status message providing feedback about step execution.
        Messages

        are categorized by severity and provide human-readable information for operators.

        '
      required:
      - severity
      - message
      properties:
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - ERROR
          title: Message Severity
          description: 'Severity level indicating the importance and type of the message.


            INFO represents informational messages about normal progress or milestones.


            WARNING represents non-critical issues that do not prevent step completion

            but should be reviewed.


            ERROR represents critical issues that prevent step completion or indicate

            failure.

            '
        message:
          type: string
          title: Message Text
          description: 'Human-readable message text providing specific information
            about the step''s

            progress, warnings, or errors.

            '
    BaseUpgradeStepStatus:
      title: Base Step Status
      description: 'Base schema containing status-related fields for tracking execution
        state of

        steps. This schema provides standardized status reporting with detailed

        messages and execution timestamps.

        '
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/BaseUpgradeStatus'
          title: Execution Status
          description: Current execution state of the step.
        messages:
          type: array
          title: Status Messages
          description: 'Ordered list of status messages generated during execution.
            Messages provide

            real-time feedback including progress updates, warnings about non-critical

            issues, and errors describing failures.

            '
          items:
            $ref: '#/components/schemas/BaseUpgradeStatusMessage'
        last_run_time:
          $ref: '#/components/schemas/EpochMsTimestamp'
          title: Last Execution Time
          description: 'Timestamp in milliseconds since Unix epoch (January 1, 1970
            00:00:00 UTC)

            indicating when this step was last executed. This field is only present

            after the step has been executed at least once. It will be absent for

            steps in NOT_STARTED state.

            '
          readOnly: true
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: Precondition Failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionRequired:
      description: Precondition Required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    enterprise_admin:
      type: apiKey
      in: header
      name: Authorization
      description: 'Supported on SSP Installer, License Hub, and SSP instance types.

        Provide the username and password in the `Authorization` header using the
        **Basic** scheme (RFC 1945). The credentials must be a base64-encoded string
        of `username:password`.

        Sample curl commands:

        * `curl -H "Authorization: Basic <base64_auth_params>" https://api.example.com`

        * `curl -u "username:password" https://api.example.com`

        '
    auditor:
      type: apiKey
      in: header
      name: Authorization
      description: 'Supported on SSP Installer, License Hub, and SSP instance types.

        Provide the username and password in the `Authorization` header using the
        **Basic** scheme (RFC 1945). The credentials must be a base64-encoded string
        of `username:password`.

        Sample curl commands:

        * `curl -H "Authorization: Basic <base64_auth_params>" https://api.example.com`

        * `curl -u "username:password" https://api.example.com`

        '
    security_engineer:
      type: apiKey
      in: header
      name: Authorization
      description: 'Supported on SSP instance type only.

        Provide the username and password in the `Authorization` header using the
        **Basic** scheme (RFC 1945). The credentials must be a base64-encoded string
        of `username:password`.

        Sample curl commands:

        * `curl -H "Authorization: Basic <base64_auth_params>" https://api.example.com`

        * `curl -u "username:password" https://api.example.com`

        '
    security_op:
      type: apiKey
      in: header
      name: Authorization
      description: 'Supported on SSP instance type only.

        Provide the username and password in the `Authorization` header using the
        **Basic** scheme (RFC 1945). The credentials must be a base64-encoded string
        of `username:password`.

        Sample curl commands:

        * `curl -H "Authorization: Basic <base64_auth_params>" https://api.example.com`

        * `curl -u "username:password" https://api.example.com`

        '
    support_bundle_collector:
      type: apiKey
      in: header
      name: Authorization
      description: 'Supported on SSP Installer, License Hub, and SSP instance types.

        Provide the username and password in the `Authorization` header using the
        **Basic** scheme (RFC 1945). The credentials must be a base64-encoded string
        of `username:password`.

        Sample curl commands:

        * `curl -H "Authorization: Basic <base64_auth_params>" https://api.example.com`

        * `curl -u "username:password" https://api.example.com`

        '
    license_admin:
      type: apiKey
      in: header
      name: license_admin
      description: Supported on License Hub instance type only. Allowed for user with
        license admin role
    license_auditor:
      type: apiKey
      in: header
      name: auditor
      description: Supported on License Hub instance type only. Allowed for user with
        license auditor role
