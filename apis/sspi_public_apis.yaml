  /sspi/iam/ldap-identity-sources/{identity-source-id}:
    get:
      tags:
      - user-management
      summary: Get an LDAP identity source
      description: 'Returns the configuration of the LDAP identity source identified
        by `identity-source-id`.

        '
      operationId: GetLdapIdentitySource
      parameters:
      - in: path
        name: identity-source-id
        description: The `id` of the LDAP identity source, as returned by `GET /iam/ldap-identity-sources`.
        required: true
        schema:
          type: string
      - in: query
        name: check_connection_status
        description: 'If `true`, Installer re-probes connectivity to the LDAP server
          before responding and

          includes the fresh result in `connectivity_result`. Defaults to `false`,
          which returns

          the stored configuration without re-checking connectivity (faster, but the
          connectivity

          result may be stale).

          '
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The LDAP identity source was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LdapIdentitySource'
              example:
                id: 8f3a1c2b-5678-4e22-8b4d-1a2b3c4d5e6f
                domain_name: corp.example.com
                base_distinguished_name: dc=corp,dc=example,dc=com
                ldap_type: ACTIVE_DIRECTORY
                ldap_server:
                  url: ldaps://ldap.corp.example.com:636
                  bind_identity: administrator@corp.example.com
                  enabled: true
                connectivity_result:
                  result: SUCCESS
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
    put:
      tags:
      - user-management
      summary: Update an LDAP identity source
      description: 'Replaces the configuration of the LDAP identity source identified
        by `identity-source-id`.

        As with creation, Installer validates connectivity to the LDAP server before
        saving; if the

        probe fails, the request is rejected with `400` and the existing configuration
        is left

        unchanged - fix the connection details and retry.

        '
      operationId: UpdateLdapIdentitySource
      parameters:
      - in: path
        name: identity-source-id
        description: The `id` of the LDAP identity source to update, as returned by
          `GET /iam/ldap-identity-sources`.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: The updated LDAP identity source configuration.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LdapIdentitySource'
            example:
              domain_name: corp.example.com
              base_distinguished_name: dc=corp,dc=example,dc=com
              ldap_type: ACTIVE_DIRECTORY
              ldap_server:
                url: ldaps://ldap.corp.example.com:636
                bind_identity: administrator@corp.example.com
                password: '********'
                enabled: true
      responses:
        '200':
          description: The LDAP identity source was updated and its connectivity was
            verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LdapIdentitySource'
        '400':
          description: The request body is missing a required field, contains an invalid
            value, or Installer could not connect to the LDAP server with the given
            configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
    delete:
      tags:
      - user-management
      summary: Remove an LDAP identity source
      description: 'Deletes the LDAP identity source identified by `identity-source-id`.
        Users and groups

        that authenticated through this source will no longer be able to log in to
        Installer,

        and any role bindings for them become orphaned - remove those separately via

        `DELETE /iam/role-bindings/{binding-id}` if they are no longer needed.

        '
      operationId: DeleteLdapIdentitySource
      parameters:
      - in: path
        name: identity-source-id
        description: The `id` of the LDAP identity source to delete, as returned by
          `GET /iam/ldap-identity-sources`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The LDAP identity source was deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
