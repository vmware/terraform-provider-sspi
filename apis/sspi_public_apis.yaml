        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'Unexpected error occurred while retrieving upgrade packages.
            Consult

            the error response details and system logs for diagnostic information.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
  /sspi/upgrade/history:
    get:
      tags:
      - sspi-upgrade
      summary: Retrieve upgrade history
      description: 'Retrieves the upgrade history of the system.


        The list is sorted in descending order by start time, with the most recent

        upgrade first. The history includes the current upgrade if one is in progress.


        Note: Upgrade Manager upgrades are not included in this history. Only

        full appliance upgrades (initiated by the user) are tracked.

        '
      operationId: GetSspiUpgradeHistory
      responses:
        '200':
          description: 'Upgrade history retrieved successfully. The response contains
            a list

            of historical upgrade records.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeHistoryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'Unexpected error occurred while retrieving upgrade history.
            Consult

            the error response details and system logs for diagnostic information.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
  /sspi/upgrade/manager:
    get:
      tags:
      - sspi-upgrade
      summary: List Upgrade Manager upgrade step definitions
      description: 'Retrieves the list of all Upgrade Manager upgrade step definitions.
        This

        endpoint returns metadata about each step in the Upgrade Manager upgrade

        process, enabling the UI to display the steps to the user.


        The Upgrade Manager is the service that orchestrates appliance upgrades. It

        must be upgraded to the target version before the main appliance upgrade can

        proceed.


        The Upgrade Manager upgrade is typically quick and involves updating the

        upgrade service binary and UI components.


        This endpoint returns step definitions only, not execution status. To

        retrieve execution status and progress, use GET /upgrade/manager/status.

        '
      operationId: ListUpgradeManagerSteps
      responses:
        '200':
          description: 'Upgrade Manager step definitions retrieved successfully. The
            response

            contains a list of all upgrade step definitions in the order they will
            execute.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeManagerStepList'
              examples:
                upgrade_manager_steps:
                  summary: Upgrade Manager step definitions
                  value:
                    results:
                    - id: Prepare for upgrade-manager upgrade
                      display_name: Prepare for upgrade-manager upgrade
                      description: Prepares for upgrade-manager upgrade
                    - id: Upgrade upgrade-manager-helper
                      display_name: Upgrade upgrade-manager-helper
                      description: Upgrades the upgrade-manager-helper
                    - id: Upgrade Manager upgrade
                      display_name: Upgrade Manager upgrade
                      description: Upgrades the Upgrade Manager
                    - id: Upgrade UI
                      display_name: Upgrade UI
                      description: Upgrades the upgrade-manager UI
                    - id: Verify upgrade
                      display_name: Verify upgrade
                      description: Verifies the upgrade-manager upgrade
                    - id: Finish upgrade
                      display_name: Finish upgrade
                      description: Finishes the upgrade-manager upgrade
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'Unexpected error occurred while retrieving upgrade step definitions.
            Consult

            the error response details and system logs for diagnostic information.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
    post:
      tags:
      - sspi-upgrade
      summary: Execute Upgrade Manager upgrade operation
      description: 'Upgrades the Upgrade Manager service itself to the target version
        specified

        in the request body. This is distinct from POST /upgrade which upgrades

        the entire appliance - this endpoint only upgrades the upgrade

        orchestration tool.


        The Upgrade Manager must be at the target version before it can

        orchestrate the main appliance upgrade (POST /upgrade).


        Prerequisites:

        - A valid upgrade package must be uploaded to the system

        - No other upgrade operation should be in progress


        The operation executes asynchronously and returns immediately with a status

        URL. Use GET /upgrade/manager/status to monitor upgrade progress.


        Only one Upgrade Manager upgrade operation can execute at a time (returns

        409 if upgrade is in progress or already completed).


        If the upgrade fails, this endpoint can be called again to retry the upgrade.

        '
      operationId: TriggerUpgradeManagerUpgrade
      parameters:
      - name: action
        in: query
        required: true
        description: 'Action to perform on Upgrade Manager. Must be set to ''upgrade''
          to trigger

          upgrade execution.

          '
        schema:
          type: string
          enum:
          - START
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeManagerRequest'
      responses:
        '202':
          description: 'Upgrade Manager upgrade operation has been accepted and initiated.
            The

            upgrade is executing asynchronously. Use the status_url in the response

            to monitor upgrade progress and track completion.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
        '400':
          description: 'Bad request. The system does not meet prerequisites for Upgrade
            Manager

            upgrade execution, or the request body is invalid.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflict. An Upgrade Manager upgrade operation is already
            in progress

            or already completed successfully. If an upgrade is in progress, monitor

            it using GET /upgrade/manager/status. If already completed, proceed to

            appliance upgrade.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'Unexpected error occurred while initiating Upgrade Manager
            upgrade. Consult

            the error response details and system logs for diagnostic information.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
  /sspi/upgrade/manager/status:
    get:
      tags:
      - sspi-upgrade
      summary: Retrieve Upgrade Manager upgrade status and progress
      description: 'Retrieves real-time status and detailed progress information for
        the

        Upgrade Manager upgrade operation. This endpoint provides visibility into

        upgrade execution with granular reporting for each upgrade step and an

        overall progress percentage.


        Poll this endpoint at regular intervals while upgrade is in progress.


        Upon completion, verify that overall_status is SUCCESS before proceeding

        with appliance upgrade (POST /upgrade). If status is FAILED,

        examine the upgrade_steps array for the failed step to identify root cause.


        If no Upgrade Manager upgrade has been initiated, the response indicates

        NOT_STARTED status with progress_percentage of 0.

        '
      operationId: GetUpgradeManagerStatus
      responses:
        '200':
          description: 'Upgrade Manager status retrieved successfully. The response
            contains

            the overall upgrade status, progress percentage, and detailed progress

            information for each upgrade step.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeManagerStatus'
              examples:
                not_started:
                  summary: Upgrade Manager upgrade not yet initiated
                  value:
                    overall_status: NOT_STARTED
                    progress_percentage: 0
                    upgrade_steps:
                    - id: Prepare for upgrade-manager upgrade
                      display_name: Prepare for upgrade-manager upgrade
                      description: Prepares for upgrade-manager upgrade
                      status: NOT_STARTED
                    - id: Upgrade upgrade-manager-helper
                      display_name: Upgrade upgrade-manager-helper
                      description: Upgrades the upgrade-manager-helper
                      status: NOT_STARTED
                    - id: Upgrade Manager upgrade
                      display_name: Upgrade Manager upgrade
                      description: Upgrades the Upgrade Manager
                      status: NOT_STARTED
                    - id: Upgrade UI
                      display_name: Upgrade UI
                      description: Upgrades the upgrade-manager UI
                      status: NOT_STARTED
                    - id: Verify upgrade
                      display_name: Verify upgrade
                      description: Verifies the upgrade-manager upgrade
                      status: NOT_STARTED
                    - id: Finish upgrade
                      display_name: Finish upgrade
                      description: Finishes the upgrade-manager upgrade
                      status: NOT_STARTED
                in_progress:
                  summary: Upgrade Manager upgrade in progress
                  value:
                    overall_status: IN_PROGRESS
