        can authenticate to

        Installer. Before saving, Installer validates connectivity to the LDAP server;
        if the

        probe fails, the request is rejected with `400` and no identity source is
        created -

        fix the connection details and retry.

        '
      operationId: CreateLdapIdentitySource
      requestBody:
        required: true
        description: The LDAP identity source configuration to create.
        content:
          application/json:
