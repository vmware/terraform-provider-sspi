---
name: Lint (Documentation)

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: $/.github/actions/setup-go
      - name: Run Linters
        uses: DavidAnson/markdownlint-cli2-action@v25.1.0
        with:
          config: '.markdownlint.jsonc'
          globs: |
            docs/*.md
            docs/data-sources/*.md
            docs/guides/*.md
            docs/resources/*.md
