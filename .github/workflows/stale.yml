---
name: Manage Stale Items

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          days-before-stale: 360
          days-before-close: 30
          exempt-issue-labels: 'needs-triage'
          exempt-pr-labels: 'needs-review'
          remove-stale-when-updated: true
          delete-branch: false
          stale-issue-label: stale
          stale-issue-message: >
            'Marking this issue as stale due to inactivity. If this issue receives no comments in the next 30 days it will automatically be closed.'
          stale-pr-label: stale
          stale-pr-message: >
            'Marking this pull request as stale due to inactivity. If this pull request receives no comments in the next 30 days it will automatically be closed.'
